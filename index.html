<title>Style Bar Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&family=Roboto+Mono&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&family=Space+Grotesk:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: builder shell — top bar / [style panel 272 | canvas | elements tree 260]. Everything in the shell uses the Style bar UI tokens; the demo website inside the canvas has its own palette. Dark-only by design. */
:root{
  color-scheme: dark;
  --surface-primary:#0F172A; --surface-secondary:#192133; --surface-tertiary:#1E293B;
  --bg-disable:#334155; --bg-primary-xdark:#0C2B4F; --bg-secondary:#1AE07C; --bg-secondary-light:#B7FBD8;
  --bg-destructive:#FF6D69; --bg-destructive-light:#FFC8C7;
  --text-primary:#F8FAFC; --text-secondary:#94A3B8; --text-caption:#64748B; --text-link:#56A3F5;
  --fg-secondary:#1AE07C; --fg-destructive:#FF6D69; --fg-invert:#0F172A;
  --stroke-primary:#94A3B8; --stroke-accent:#56A3F5; --stroke-destructive:#FF6D69; --stroke-attention:#F2D23C;
  --stroke-success:#1AE07C; --stroke-divider:#475569; --stroke-disabled:#334155;
  --shadow1:0 0 10px 4px #000316;
  --checker:repeating-conic-gradient(#D4D8DE 0 25%, #F4F5F7 0 50%) 0 0/8px 8px;
  --font-ui:'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-code:'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  /* shell */
  --shell-bg:#0A1020; --shell-line:#1E293B; --sel:#3B8AF0;
}
html,body{height:100%}
body{background:var(--shell-bg);color:var(--text-primary);font:400 12px/1.35 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
#app{height:100%}

.pr{display:grid;grid-template-rows:56px minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface-primary);border-bottom:1px solid var(--shell-line);min-width:0}
.top .grp{display:flex;align-items:center;gap:6px}
.top .sp{flex:1;min-width:8px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--bg-secondary);display:grid;place-items:center;color:var(--fg-invert);font:700 15px/1 var(--font-ui);letter-spacing:-.04em;flex:none}
.bp{width:300px}
.bp .bgrp-box{padding:3px}
.vsep{width:1px;height:24px;background:var(--shell-line);margin:0 4px}
.dirty{width:6px;height:6px;border-radius:50%;background:var(--stroke-attention);display:inline-block}

.work{display:grid;grid-template-columns:300px minmax(0,1fr) 260px;min-height:0}
.work.preview{grid-template-columns:0 minmax(0,1fr) 0}
.work.preview .left,.work.preview .right{visibility:hidden}

/* left style panel */
.left{background:var(--surface-primary);border-right:1px solid var(--shell-line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-sa{flex:1;min-height:0;height:100%}
.left-sa>.sa-vp{height:100%;max-height:none!important;overflow-x:hidden}
.left-sa>.sb[data-orientation=vertical]{right:0}
.sp-ui{width:292px;display:flex;flex-direction:column;gap:24px;padding:24px 0}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px;min-height:32px}
.sp-head b{font:600 14px/1.4 var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-row{padding:0 24px}
.secs{display:flex;flex-direction:column;gap:24px}
.secs .acc-body{gap:16px}
.slot{display:flex;flex-direction:column}
.sp-ui .two{gap:16px}
.lp-head{display:flex;flex-direction:column;gap:12px;padding:16px 24px 16px}
.lp-title{display:flex;align-items:center;gap:8px;min-height:24px}
.lp-title b{font:600 14px/1.3 var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagchip{font:400 11px/1 var(--font-code);color:var(--text-secondary);background:var(--surface-tertiary);border-radius:4px;padding:3px 5px;flex:none}
.lp-title .grow{flex:1}
.ctx{display:flex;align-items:center;gap:6px;color:var(--text-secondary);padding:0 2px}
.ctx .pill{font:600 11px/1 var(--font-ui);padding:3px 6px;border-radius:4px;background:var(--bg-primary-xdark);color:var(--text-link)}
.lp-sep{height:1px;background:var(--stroke-divider)}
.left .mbox{width:100%}
.left .mbox .pbox{max-width:140px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.gen{display:flex;flex-direction:column;gap:16px;padding:8px 24px 24px}
.raw{padding:8px 24px 24px}
.hint{color:var(--text-caption);padding:0 6px}
.empty-sel{padding:24px;color:var(--text-secondary);display:flex;flex-direction:column;gap:8px}

/* canvas */
.center{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background-color:var(--shell-bg);background-image:radial-gradient(circle at 1px 1px,#1A2438 1px,transparent 1.2px);background-size:16px 16px}
.cv-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--stroke-divider) transparent}
.cv-inner{position:relative;padding:24px;min-width:100%;display:flex;justify-content:center}
.cv-frame-host{position:relative}
.cv-frame{transform-origin:top left;box-shadow:0 0 0 1px #1E293B,0 20px 60px rgba(0,3,22,.6)}
.cv-frame.anim{transition:width .2s}
.ov{position:absolute;inset:0;pointer-events:none}
.ov-hover{position:absolute;border:1px dashed var(--stroke-accent);pointer-events:none}
.ov-hover span{position:absolute;left:-1px;bottom:100%;background:var(--stroke-accent);color:var(--fg-invert);font:600 10px/1 var(--font-ui);padding:3px 5px;border-radius:3px 3px 0 0;white-space:nowrap}
.ov-sel{position:absolute;border:2px solid var(--sel);pointer-events:none}
.ov-bar{position:absolute;display:flex;align-items:center;gap:2px;height:26px;padding:0 4px 0 2px;background:var(--sel);color:#fff;border-radius:4px 4px 0 0;pointer-events:auto;font:600 12px/1 var(--font-ui);white-space:nowrap;box-shadow:0 2px 8px rgba(0,3,22,.4)}
.ov-bar.below{border-radius:0 0 4px 4px}
.ov-bar .nm{padding:0 6px 0 2px}
.ov-bar button{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;color:#fff;border-radius:3px;cursor:pointer;padding:0}
.ov-bar button:hover{background:rgba(255,255,255,.18)}
.ov-bar button:disabled{opacity:.4;cursor:not-allowed;background:none}
.ov-bar button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.ov-bar .grip{opacity:.8;cursor:grab}
.crumbs{display:flex;align-items:center;gap:2px;padding:0 12px;height:32px;border-top:1px solid var(--shell-line);background:var(--surface-primary);color:var(--text-secondary);overflow:hidden;white-space:nowrap;flex:none}
.crumbs button{border:0;background:none;color:var(--text-secondary);padding:3px 5px;border-radius:4px;cursor:pointer;font:400 12px/1 var(--font-ui)}
.crumbs button:hover{color:var(--text-primary);background:var(--surface-tertiary)}
.crumbs button[aria-current]{color:var(--text-link)}
.crumbs .sep{color:var(--text-caption)}
.crumbs .sp{flex:1}
.crumbs .last{color:var(--text-caption)}
.dev{height:240px;flex:none;border-top:1px solid var(--shell-line);background:var(--surface-primary);display:flex;flex-direction:column;min-height:0}
.dev-h{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;font-weight:600;border-bottom:1px solid var(--shell-line)}
.dev-h .grow{flex:1}
.dev pre{margin:0;padding:12px 16px;overflow:auto;flex:1;font:400 12px/18px var(--font-code);color:var(--text-primary);scrollbar-width:thin}
.preview-exit{position:absolute;top:12px;right:12px;z-index:5}

/* elements tree */
.right{background:var(--surface-primary);border-left:1px solid var(--shell-line);display:flex;flex-direction:column;min-height:0}
.tr-h{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;font:600 14px/1.3 var(--font-ui)}
.tr-h .grow{flex:1}
.tr{flex:1;overflow:auto;padding:0 8px 24px;scrollbar-width:thin;scrollbar-color:var(--stroke-divider) transparent}
.tr-row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding-right:8px;border-radius:4px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.tr-row:hover,.tr-row.is-hover{background:var(--surface-secondary);color:var(--text-primary)}
.tr-row.is-sel{background:var(--bg-primary-xdark);color:var(--text-primary)}
.tr-row.is-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--stroke-accent);border-radius:2px}
.tr-row:focus-visible{outline:2px solid var(--stroke-accent);outline-offset:-2px}
.tr-chev{width:16px;height:16px;display:grid;place-items:center;border:0;background:none;color:inherit;padding:0;cursor:pointer;flex:none;border-radius:3px}
.tr-chev svg{transition:transform .12s}
.tr-chev[aria-expanded=true] svg{transform:rotate(90deg)}
.tr-ic{color:var(--text-caption);flex:none}
.tr-row.is-sel .tr-ic{color:var(--text-link)}
.tr-lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr-lbl i{font-style:normal;color:var(--text-caption)}
.tr-dot{width:6px;height:6px;border-radius:50%;background:var(--fg-secondary);flex:none}

/* toasts */
.toasts{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:100;pointer-events:none}
.toast{background:var(--surface-tertiary);color:var(--text-primary);border:1px solid var(--stroke-disabled);box-shadow:var(--shadow1);padding:8px 12px;border-radius:6px;font:400 12px/1.35 var(--font-ui);animation:popIn .15s ease-out}
.narrow{display:none}
@media (max-width: 900px){
  .pr,.work{display:none}
  .narrow{display:flex;flex-direction:column;gap:12px;padding:32px 16px;color:var(--text-secondary);font-size:14px;line-height:1.5;height:100%;overflow:auto}
  .narrow b{color:var(--text-primary);font-size:17px}
  body{overflow:auto}
}

/* ================= demo website (inside canvas) ================= */
.site{container:site / inline-size;--ink:#F1ECE4;--muted:#9AA3B5;--accent:#8B7BE8;--bg:#0E1424;--surface:#161E31;--line:#2A3550;
  --space-xs:8px;--space-s:12px;--space-m:16px;--space-l:24px;--space-xl:40px;--space-xxl:64px;--text-h1:56px;--text-h2:40px;--text-body:15px;
  background:var(--bg);color:var(--ink);font:400 15px/1.5 'Manrope',system-ui,sans-serif;min-height:600px;cursor:default}
.site *{box-sizing:border-box}
.site a{color:inherit}
.site img{display:block;max-width:none}
.site.selecting [data-el]{cursor:pointer}
.site [contenteditable=true]{outline:2px solid var(--stroke-attention);outline-offset:2px;cursor:text}
.site.outlines [data-el]{outline:1px dashed rgba(86,163,245,.25);outline-offset:-1px}
.s-nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 64px}
.s-brand{display:flex;flex-direction:column;gap:2px}
.s-logo{font-family:'DM Serif Display',Georgia,serif;font-size:26px;font-style:italic;line-height:1}
.s-tagline{font-size:9px;letter-spacing:.24em;color:var(--muted)}
.s-menu{display:flex;gap:28px}
.s-menu-link{font-size:12px;color:var(--muted);text-decoration:none}
.s-btn-outline{font-size:11px;letter-spacing:.06em;padding:8px 14px;border:1px solid var(--accent);border-radius:2px;text-decoration:none}
.s-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:56px 64px 96px}
.s-hero-text{display:flex;flex-direction:column;gap:20px;min-width:0}
.s-eyebrow{font-size:11px;letter-spacing:.24em;color:var(--accent);margin:0}
.s-h1{font-family:'DM Serif Display',Georgia,serif;font-size:56px;line-height:1.05;margin:0;font-weight:400}
.s-lead{font-size:15px;line-height:1.6;color:var(--muted);max-width:420px;margin:0}
.s-cta{display:flex;gap:12px;flex-wrap:wrap}
.s-btn{display:inline-block;padding:12px 20px;font-size:13px;font-weight:500;border-radius:2px;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.s-btn-primary{background:var(--accent);color:#fff}
.s-btn-ghost{border:1px solid var(--line)}
.s-hero-img{position:relative;height:440px;min-width:0}
.s-img-a{position:absolute;right:0;top:0;width:78%;height:100%;object-fit:cover;border-radius:6px}
.s-img-b{position:absolute;left:0;bottom:40px;width:46%;height:62%;object-fit:cover;border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.s-clients{display:flex;align-items:center;gap:40px;flex-wrap:wrap;padding:28px 64px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.s-clients-label{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0}
.s-logos{display:flex;gap:40px;flex-wrap:wrap}
.s-logo-item{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:#6E7891;margin:0}
.s-section{display:flex;flex-direction:column;gap:20px;padding:96px 64px}
.s-pill{align-self:flex-start;font-size:10px;letter-spacing:.14em;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);margin:0}
.s-h2{font-family:'DM Serif Display',Georgia,serif;font-size:40px;line-height:1.1;margin:0;font-weight:400}
.s-p{font-size:14px;line-height:1.6;color:var(--muted);max-width:480px;margin:0}
.s-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.s-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px}
.s-h3{font-family:'DM Serif Display',Georgia,serif;font-size:22px;margin:0;font-weight:400}
.s-card-p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.s-quote-sec{display:flex;flex-direction:column;gap:18px;align-items:flex-start;padding:96px 64px;background:var(--surface)}
.s-quote{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1.3;margin:0;max-width:720px}
.s-author{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0}
.s-footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:32px 64px;font-size:12px;color:var(--muted)}
.s-footer p{margin:0}
.s-block{min-width:0}
.s-new-text{margin:0}
.s-new-heading{font-family:'DM Serif Display',Georgia,serif;font-size:32px;font-weight:400;margin:0}
.s-new-img{width:320px;height:200px;object-fit:cover;border-radius:6px}
.s-new-block{min-height:48px;padding:16px;border:1px dashed var(--line)}
@container site (max-width: 991px){
  .s-nav,.s-hero,.s-clients,.s-section,.s-quote-sec,.s-footer{padding-left:40px;padding-right:40px}
  .s-hero{grid-template-columns:1fr}
  .s-hero-img{height:360px}
  .s-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s-menu{gap:18px}
}
@container site (max-width: 767px){
  .s-nav,.s-hero,.s-clients,.s-section,.s-quote-sec,.s-footer{padding-left:20px;padding-right:20px}
  .s-menu{display:none}
  .s-hero{padding-top:32px;padding-bottom:56px}
  .s-hero-img{height:280px}
  .s-section,.s-quote-sec{padding-top:56px;padding-bottom:56px}
  .s-h2{font-size:30px}
  .s-cards{grid-template-columns:minmax(0,1fr)}
  .s-quote{font-size:22px}
}
/* ================= Design-system components (.ds) ================= */
.ds{font:400 12px/1.35 var(--font-ui);color:var(--text-primary);text-align:left}
.ds .ic{display:block;flex:none}
.ds :focus-visible{outline:2px solid var(--stroke-accent);outline-offset:1px}

/* badge-change */
.badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg-secondary);flex:none}
.badge[data-type=inherited]{background:var(--stroke-attention)}
.badge[data-type=error]{background:var(--fg-destructive)}

/* info */
.info{display:flex;gap:8px;align-items:flex-start;color:var(--text-secondary)}
.info .ic{color:var(--text-caption)}

/* tooltip */
.tt-anchor{position:relative;display:inline-flex}
.tt{position:absolute;z-index:40;background:var(--surface-tertiary);color:var(--text-primary);padding:4px 6px;border-radius:4px;white-space:nowrap;font:400 12px/1.35 var(--font-ui);pointer-events:none;box-shadow:0 2px 8px rgba(0,3,22,.5)}
.tt::after{content:"";position:absolute;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
.tt[data-side=top]{bottom:calc(100% + 8px);left:50%;translate:-50% 0}
.tt[data-side=top]::after{top:calc(100% - 4px);left:calc(50% - 4px)}
.tt[data-side=bottom]{top:calc(100% + 8px);left:50%;translate:-50% 0}
.tt[data-side=bottom]::after{bottom:calc(100% - 4px);left:calc(50% - 4px)}
.tt[data-side=left]{right:calc(100% + 8px);top:50%;translate:0 -50%}
.tt[data-side=left]::after{left:calc(100% - 4px);top:calc(50% - 4px)}
.tt[data-side=right]{left:calc(100% + 8px);top:50%;translate:0 -50%}
.tt[data-side=right]::after{right:calc(100% - 4px);top:calc(50% - 4px)}
.tt.static{position:relative;inset:auto;translate:none;display:inline-block;box-shadow:none}
.tt-in{animation:ttIn .12s ease-out}
@keyframes ttIn{from{opacity:0}to{opacity:1}}

/* scrollbar */
.sa{position:relative}
.sa-vp{overflow:auto;scrollbar-width:none;height:100%;max-height:inherit}
.sa-vp::-webkit-scrollbar{display:none}
.sb{position:absolute;opacity:0;transition:opacity .15s;touch-action:none}
.sa:hover>.sb,.sb.is-drag,.sb.is-show,.sb.always{opacity:1}
.sb[data-orientation=vertical]{top:0;bottom:0;right:2px;width:8px}
.sb[data-orientation=horizontal]{left:0;right:0;bottom:2px;height:8px}
.sb-track{position:absolute;inset:0}
.sb-thumb{position:absolute;border-radius:4px;background:var(--stroke-divider);transition:background .12s}
.sb[data-orientation=vertical] .sb-thumb{left:0;width:8px}
.sb[data-orientation=horizontal] .sb-thumb{top:0;height:8px}
.sb:hover .sb-thumb,.sb.is-hover .sb-thumb{background:var(--text-secondary)}
.sb.is-drag .sb-thumb,.sb.is-active .sb-thumb{background:var(--text-primary)}
.sb.static{position:relative;opacity:1}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:24px;padding:0 12px;border-radius:4px;border:1px solid transparent;font:600 12px/1.35 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.btn[data-size=big]{height:32px;padding:0 16px}
.btn[data-variant=primary]{background:var(--bg-secondary);color:var(--fg-invert)}
.btn[data-variant=primary]:is(:hover,.is-hover){background:var(--bg-secondary-light)}
.btn[data-variant=primary][data-tone=destructive]{background:var(--bg-destructive)}
.btn[data-variant=primary][data-tone=destructive]:is(:hover,.is-hover){background:var(--bg-destructive-light)}
.btn[data-variant=secondary]{background:transparent;border-color:var(--stroke-success);color:var(--fg-secondary)}
.btn[data-variant=secondary]:is(:hover,.is-hover){background:color-mix(in srgb,var(--fg-secondary) 22%,transparent)}
.btn[data-variant=secondary][data-tone=destructive]{border-color:var(--fg-destructive);color:var(--fg-destructive)}
.btn[data-variant=secondary][data-tone=destructive]:is(:hover,.is-hover){background:color-mix(in srgb,var(--fg-destructive) 22%,transparent)}
.btn:is(:disabled,.is-disabled)[data-variant]{background:var(--bg-disable);color:var(--text-caption);border-color:transparent;cursor:not-allowed}
.btn:is(:disabled,.is-disabled)[data-variant=secondary]{background:transparent;border-color:var(--bg-disable)}
.btn.icon-only{padding:0;width:24px}
.btn.icon-only[data-size=big]{width:32px}

/* button-icon-sm */
.ibs{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;padding:0;border:0;border-radius:3px;background:none;color:var(--text-secondary);cursor:pointer;flex:none}
.ibs::before{content:"";position:absolute;inset:-4px}
.ibs:is(:hover,.is-hover){color:var(--text-primary)}
.ibs:is([aria-pressed=true],.is-active){color:var(--text-link)}
.ibs:is(:disabled,.is-disabled){color:var(--text-caption);cursor:not-allowed}

/* button-icon-lg */
.ibl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:var(--surface-tertiary);color:var(--text-secondary);font:400 12px/1.35 var(--font-ui);white-space:nowrap;cursor:pointer;flex:none;transition:background .12s,color .12s,border-color .12s}
.ibl:is(:hover,.is-hover){border-color:var(--stroke-primary);color:var(--text-primary)}

/* ---------- value parsing (spacing / size) ---------- */
const SIZE_RE = /^(-?\d*\.?\d+)\s*(px|rem|em|%|vh|vw)?$/i;

  if (allowAuto && /^auto$/i.test(s)) return { ok: true, text: 'auto' };
  if (keywords.includes(s.toLowerCase())) return { ok: true, text: s.toLowerCase() };
  const m = s.match(SIZE_RE);
  if (!m) return { ok: false };
  const n = parseFloat(m[1]);
  if (!allowNegative && n < 0) return { ok: false, negative: true };

  return `${n}${p.unit}`;
}

/* Scrollbar bound to any scrollable element */

  const measure = useCallback(() => {

    const client = v ? el.clientHeight : el.clientWidth;
    const full = v ? el.scrollHeight : el.scrollWidth;
    const sp = v ? el.scrollTop : el.scrollLeft;
    const tl = v ? t.clientHeight : t.clientWidth;
    if (full <= client + 1) { setM(p => p.need ? { size: 0, pos: 0, need: false } : p); return; }
    const size = Math.max(24, tl * client / full);

    return () => { el.removeEventListener('scroll', measure); el.removeEventListener('input', measure); ro.disconnect(); mo.disconnect(); };

    e.preventDefault(); e.stopPropagation();
    const el = target.current, t = track.current;
    const start = v ? e.clientY : e.clientX, startScroll = v ? el.scrollTop : el.scrollLeft;
    const tl = v ? t.clientHeight : t.clientWidth;
    const client = v ? el.clientHeight : el.clientWidth, full = v ? el.scrollHeight : el.scrollWidth;
    const ratio = (full - client) / Math.max(1, tl - m.size);
    const node = e.currentTarget; node.setPointerCapture(e.pointerId); setDrag(true);
    const move = ev => { const d = (v ? ev.clientY : ev.clientX) - start; if (v) el.scrollTop = startScroll + d * ratio; else el.scrollLeft = startScroll + d * ratio; };
    const up = () => { setDrag(false); node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up); };

    <div className="sb-track" ref=${track} style=${trackStyle} onPointerDown=${onTrackDown}>

/* ---------- Floating layer (portal) ---------- */
function Floating({ anchor, open, onClose, children, gap = 4, align = 'start' }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    if (!open) { setPos(null); return; }
    const place = () => {
      const a = anchor.current, el = ref.current; if (!a || !el) return;
      const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
      let top = r.bottom + gap, side = 'bottom';
      if (top + h > window.innerHeight - 8 && r.top - gap - h > 8) { top = r.top - gap - h; side = 'top'; }
      let left = align === 'end' ? r.right - w : r.left;
      left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
      setPos({ top, left, side });
    };
    place();
    const ro = new ResizeObserver(place); if (ref.current) ro.observe(ref.current);
    window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
    return () => { ro.disconnect(); window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true); };
  }, [open]);
  useEffect(() => {
    if (!open) return;
    const onDown = e => { if (ref.current?.contains(e.target) || anchor.current?.contains(e.target)) return; onClose('outside'); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); onClose('escape'); } };
    document.addEventListener('pointerdown', onDown, true); document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown, true); document.removeEventListener('keydown', onKey); };
  }, [open, onClose]);

     style=${{ top: pos ? pos.top : -9999, left: pos ? pos.left : -9999 }}>${children}</div>`, document.body);
}

function PopoverPanel({ type = 'var', title = 'Modal Header', showHeader = true, showHeading = true, items, value, onSelect, onAction, manageLabel, autoFocus = true, itemKind = 'size', listLabel, forceHi }) {
  const selIdx = items.findIndex(i => i.id === value);
  const [hi, setHi] = useState(forceHi ?? Math.max(0, selIdx));
  const vp = useRef(null);
  const buf = useRef({ s: '', t: 0 });
  const baseId = useMemo(() => 'pl' + Math.random().toString(36).slice(2, 7), []);
  useEffect(() => { if (autoFocus) vp.current?.focus({ preventScroll: true }); }, []);
  useEffect(() => { const el = vp.current?.querySelector(`#${baseId}-${hi}`); el?.scrollIntoView({ block: 'nearest' }); }, [hi]);

function Slider({ value, max, onChange, label, valueText, className, style, thumbStyle }) {
  const ref = useRef(null);
  const set = (clientX) => { const r = ref.current.getBoundingClientRect(); onChange(clamp((clientX - r.left) / r.width, 0, 1) * max, 'drag'); };
  const down = e => { e.preventDefault(); ref.current.focus(); const node = e.currentTarget; node.setPointerCapture(e.pointerId); set(e.clientX);
    const mv = ev => set(ev.clientX); const up = () => { node.removeEventListener('pointermove', mv); node.removeEventListener('pointerup', up); onChange(null, 'commit'); };
    node.addEventListener('pointermove', mv); node.addEventListener('pointerup', up); };
  const key = e => {
    const st = (e.shiftKey ? 10 : 1) * max / 100; let n = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') n = value + st; else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') n = value - st;
    else if (e.key === 'PageUp') n = value + max / 10; else if (e.key === 'PageDown') n = value - max / 10;
    else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = max;
    if (n != null) { e.preventDefault(); onChange(clamp(n, 0, max), 'key'); }
  };
  return html`<div ref=${ref} className=${cx('sl', className)} style=${style} role="slider" tabIndex=${0} aria-label=${label}
      aria-valuemin=${0} aria-valuemax=${max} aria-valuenow=${Math.round(value)} aria-valuetext=${valueText}
      onPointerDown=${down} onKeyDown=${key}>
    <div className="sl-thumb" style=${{ left: `${value / max * 100}%`, ...thumbStyle }}></div>
  </div>`;
}

function NumField({ value, caption, onCommit, min = 0, max = 255, suffix = '', wide, parse, label }) {
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState(false);
  const shown = draft ?? (value + suffix);
  const commit = () => {
    if (draft == null) return;
    const r = parse ? parse(draft) : (() => { const n = parseFloat(String(draft).replace(suffix, '')); return isNaN(n) ? null : clamp(Math.round(n), min, max); })();
    if (r == null) { setErr(true); return; }
    setErr(false); setDraft(null); onCommit(r);
  };
  const key = e => {
    if (e.key === 'Enter') { commit(); e.currentTarget.select(); }
    else if (e.key === 'Escape') { e.stopPropagation(); setDraft(null); setErr(false); }
    else if (!parse && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); const d = (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1); setDraft(null); setErr(false); onCommit(clamp(value + d, min, max)); }
  };
  return html`<label className=${cx('nf', wide && 'wide')}>
    <input type="text" value=${shown} aria-label=${label || caption} className=${err ? 'is-error' : ''} aria-invalid=${err}
      onChange=${e => setDraft(e.target.value)} onBlur=${commit} onKeyDown=${key} onFocus=${e => e.target.select()} spellCheck=${false} />
    <span className="nf-cap">${caption}</span>
  </label>`;
}

function ColorPicker({ value = '#4272F9', alpha = 1, format: fmtProp, onFormatChange, onChange, force }) {

/* ================= Form field ================= */
function FormField(props) {

    const num = F[p.unit] && F[next] ? +(p.num * F[p.unit] / F[next]).toFixed(3) : p.num;

            pressed=${!!boundVar || open === 'var'} disabled=${isDis} aria-haspopup="listbox" tip=${boundVar ? boundVar.name : 'Bind to variable'}
            onClick=${e => { e.stopPropagation(); setOpen(o => o === 'var' ? null : 'var'); }} />`}

      </div>
      ${connected === 'color' && html`<${PreviewColor} btnRef=${swatchRef} color=${swatchColor} open=${open === 'color'} disabled=${isDis}
          onClick=${() => setOpen(o => o === 'color' ? null : 'color')} />`}
      ${connected === 'action' && onAction && html`<${Tooltip} content=${actionLabel || 'Action'} side="top"><${IconBtnLg} icon=${actionIcon || 'tune'} showText=${false} label=${actionLabel || 'Action'} pressed=${actionPressed} disabled=${isDis} onClick=${onAction} /><//>`}
      ${connected === 'action' && !onAction && html`<${Tooltip} content="Switch unit" side="top"><${IconBtnLg} icon="swap" text=${unit} showIcon=${false} label=${`Unit: ${unit}. Switch unit`} disabled=${isDis} onClick=${cycleUnit} /><//>`}
    </div>
    ${showHelp && html`<div id=${uid + '-help'} className=${cx('helper', error != null && 'err')}>${helper}</div>`}
    <${Floating} anchor=${anchor} open=${open === 'var'} onClose=${(why) => { setOpen(null); if (why === 'escape') inputRef.current?.focus(); }}>
      <${PopoverPanel} type="var" title=${kind === 'color' ? 'Colour variables' : 'Size variables'} items=${vars} itemKind=${kind === 'color' ? 'color' : 'size'}
        value=${binding} onSelect=${pickVar} onAction=${popAction} />
    <//>
    <${Floating} anchor=${anchor} open=${open === 'options'} onClose=${(why) => { setOpen(null); if (why === 'escape') inputRef.current?.focus(); }}>
      <${PopoverPanel} type="options-list" items=${options} value=${optsVal} listLabel=${label}
        onSelect=${o => { setValue(o.value); setBinding(null); setError(null); setOpen(null); log(`${name}:select`, { value: o.value }); onCommit?.(o.value); inputRef.current?.focus(); }} />
    <//>
    <${Floating} anchor=${connected === 'color' ? swatchRef : anchor} align="end" open=${open === 'color'} onClose=${(why) => { setOpen(null); if (why === 'escape') swatchRef.current?.focus(); }}>
      <${ColorPicker} value=${swatchColor || '#4272F9'} onChange=${(hex, al, why) => { setBinding(null); setError(null); setDraft(null); setValue(hex); if (why !== 'drag') log(`${name}:colour`, { value: hex, opacity: al }); onCommit?.(hex); }} />

/* ================= form-field-custom (box-model cell) ================= */
function FormFieldCustom({ value = '', placeholder = '0', force, error: errProp, linked, onCommit, onFocusSide, onBlurSide, label = 'Value', allowNegative = true, name = 'side' }) {
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState(errProp ? (value || '123kl') : null);
  const ref = useRef(null);
  const drag = useRef(null);
  const log = useLog();
  const commit = raw => {
    const r = parseSize(raw, { allowNegative });
    if (!r.ok) { setErr(raw); setDraft(null); log(`${name}:invalid`, { input: raw }); return; }
    setErr(null); setDraft(null); if (r.text !== value) onCommit?.(r.text === '0px' ? '' : r.text);
  };
  const onDown = e => {
    if (document.activeElement === ref.current) return;
    e.preventDefault();
    const start = { y: e.clientY, base: parseSize(value || '0'), moved: false };
    drag.current = start;
    const node = ref.current; node.setPointerCapture(e.pointerId);
    const mv = ev => {
      const dy = start.y - ev.clientY;
      if (!start.moved && Math.abs(dy) < 3) return;
      start.moved = true;
      const b = start.base.ok && start.base.num != null ? start.base : { num: 0, unit: 'px' };
      let n = Math.round(b.num + dy / 2); if (!allowNegative) n = Math.max(0, n);
      start.val = `${n}${b.unit}`;
      setErr(null); setDraft(start.val);
    };
    const up = () => {
      node.removeEventListener('pointermove', mv); node.removeEventListener('pointerup', up);
      if (start.moved) { const d = start.val; setDraft(null); if (d != null) { const r = parseSize(d); onCommit?.(r.num === 0 ? '' : r.text); log(`${name}:scrub`, { value: d }); } }
      else { node.focus(); node.select(); }
      drag.current = null;
    };
    node.addEventListener('pointermove', mv); node.addEventListener('pointerup', up);
  };
  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); if (draft != null) commit(draft); e.currentTarget.select(); }
    else if (e.key === 'Escape') { setDraft(null); setErr(null); e.currentTarget.blur(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); const base = draft ?? value ?? ''; commit(stepSize(base || '0', (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1))); }
  };
  const shown = draft ?? err ?? value;
  return html`<input ref=${ref} type="text" className=${cx('ffc', force && 'is-' + force, linked && 'is-linked', (err != null || force === 'error') && 'is-error')}
      value=${shown} placeholder=${placeholder} aria-label=${label} aria-invalid=${err != null} spellCheck=${false} autoComplete="off"
      title=${err != null ? 'Invalid value. Use a number with px, rem, em or %' : 'Drag up/down to scrub, click to type'}
      onPointerDown=${onDown} onChange=${e => { setErr(null); setDraft(e.target.value); }} onKeyDown=${onKey}
      onFocus=${() => onFocusSide?.()} onBlur=${() => { if (draft != null) commit(draft); onBlurSide?.(); }} />`;
}

/* ================= padding / margin-padding ================= */
const SIDES = ['top', 'right', 'bottom', 'left'];
const linkedSides = (mode, side) => mode === 'all' ? SIDES : mode === 'x' && (side === 'left' || side === 'right') ? ['left', 'right'] : mode === 'y' && (side === 'top' || side === 'bottom') ? ['top', 'bottom'] : [side];

function usePaddingModel(initial, name, onChange) {
  const [val, setVal] = useState(initial || { top: '', right: '', bottom: '', left: '' });
  const [mode, setMode] = useState('none');
  const [focus, setFocus] = useState(null);
  const log = useLog();
  const commitSide = (side, v) => {
    const sides = linkedSides(mode, side);
    const n = { ...val }; sides.forEach(s => n[s] = v); setVal(n); onChange?.(n);
    log(`${name}:change`, { sides: sides.join('+'), value: v || '0' });
  };
  const cycle = () => { const n = LINK_MODES[(LINK_MODES.indexOf(mode) + 1) % LINK_MODES.length]; setMode(n); log(`${name}:link`, { mode: n }); };
  const active = focus ? linkedSides(mode, focus) : [];
  return { val, mode, focus, setFocus, commitSide, cycle, active };
}

function BoxCells({ m, name, allowNegative, forceSides = {}, prefix, onSelect, placeholders = {} }) {
  return SIDES.map(s => html`<div key=${s} className=${'bx-' + s[0]}>
    <${FormFieldCustom} name=${`${name}-${s}`} label=${`${prefix} ${s}`} value=${m.val[s]} allowNegative=${allowNegative} placeholder=${placeholders[s] || '0'}
      force=${forceSides[s]} linked=${m.focus && m.focus !== s && m.active.includes(s)}
      onFocusSide=${() => { m.setFocus(s); onSelect?.(); }} onBlurSide=${() => m.setFocus(f => f === s ? null : f)} onCommit=${v => m.commitSide(s, v)} /></div>`);
}

/* PaddingBox can own its model (standalone) or receive one from MarginPadding */
function PaddingBox({ initial, force, forceSides, forceMode, large, onChange, name = 'padding', slot, model, onSelect, targeted, placeholders }) {
  const own = usePaddingModel(initial, name, onChange);
  const m = model || own;
  const mode = forceMode || m.mode;
  const mm = { ...m, mode };
  const activeCls = force ? 'is-' + force : m.focus ? 'is-active' : '';
  return html`<div className=${cx('pbox', large && 'lg', activeCls, targeted && 'is-target')} role="group" aria-label="Padding">
    <span className="box-lbl">P</span>
    <${BoxCells} m=${mm} name=${name} allowNegative=${false} forceSides=${forceSides} prefix="Padding" onSelect=${onSelect} placeholders=${placeholders} />
    <div className="bx-c">${slot !== undefined ? slot : html`<${ButtonCustom} mode=${mode} onClick=${m.cycle} />`}</div>
  </div>`;
}

/* The single link-sides button in the centre acts on whichever box is selected:
   focusing / clicking a margin side selects margin, a padding side selects padding. */
function MarginPadding({ initialMargin, initialPadding, force, forceSides, forceTarget, forceMode, onChange, placeholders = {} }) {
  const mg = usePaddingModel(initialMargin, 'margin', v => onChange?.({ margin: v }));
  const pd = usePaddingModel(initialPadding, 'padding', v => onChange?.({ padding: v }));
  const [targetState, setTargetState] = useState('padding');
  const target = forceTarget || targetState;
  const log = useLog();
  const select = t => { if (t !== targetState) { setTargetState(t); log('link-target', { box: t }); } };
  const tm = target === 'margin' ? mg : pd;
  const mode = forceMode || tm.mode;
  const mgView = target === 'margin' && forceMode ? { ...mg, mode: forceMode } : mg;
  const onDown = e => {
    if (e.target.closest('.bcu')) return;
    select(e.target.closest('.pbox') ? 'padding' : 'margin');
  };
  const btn = html`<${ButtonCustom} mode=${mode} scope=${target === 'margin' ? 'Margin' : 'Padding'} onClick=${() => { tm.cycle(); }} />`;
  return html`<div className=${cx('mbox', force ? 'is-' + force : mg.focus && 'is-active', target === 'margin' && 'is-target')} role="group" aria-label="Margin" onPointerDown=${onDown}>
    <span className="box-lbl">M</span>
    <${BoxCells} m=${mgView} name="margin" allowNegative=${true} forceSides=${forceSides} prefix="Margin" onSelect=${() => select('margin')} placeholders=${placeholders.margin} />
    <div className="bx-c"><${PaddingBox} model=${pd} slot=${btn} targeted=${target === 'padding'} onSelect=${() => select('padding')} placeholders=${placeholders.padding} /></div>
  </div>`;
}

/* ================= Accordion ================= */

function StyleSegments({ ctx, prop, label, items, showText = false, showIcons = true }) {
  const own = ctx.own[prop] || '';
  const inh = ctx.inherit(prop);
  const comp = ctx.comp[prop] || '';
  const shown = own || inh?.v || comp;
  const value = items.find(i => i.id === shown || (shown && shown.startsWith(i.id + ' ')))?.id ?? null;
  return html`<${ButtonGroup} label=${label} items=${items} value=${value} showText=${showText} showIcons=${showIcons}
    badge=${own ? 'default' : inh ? 'inherited' : null}
    onChange=${v => ctx.set(prop, v === own ? '' : v)} />`;
}

const Two = ({ children }) => html`<div className="two">${children}</div>`;

function Section({ id, ctx, open, onToggle, children }) {
  const has = SECTIONS[id].some(p => ctx.own[p]);
  return html`<${Accordion} title=${SEC_TITLE[id]} hasChanges=${has} open=${open} onToggle=${onToggle} showInfo=${!!SEC_INFO[id]} info=${SEC_INFO[id]}>
    <div className="slot" style=${{ gap: SEC_GAP[id] }}>${children}</div><//>`;
}

function BackgroundFields({ ctx }) {
  const img = ctx.own['background-image'] || '';
  const initial = /gradient/.test(img) ? 'gradient' : /url\(/.test(img) ? 'image' : 'color';
  const [type, setType] = useState(initial);
  const g = img.match(/linear-gradient\(\s*([-\d.]+deg)\s*,\s*([^,]+?)\s*,\s*([^)]+?)\s*\)/) || [];
  const setGrad = (angle, a, b) => ctx.set('background-image', `linear-gradient(${angle || '135deg'}, ${a || '#8B7BE8'}, ${b || '#0E1424'})`);
  const pickType = t => {
    setType(t);
    if (t === 'color') ctx.setMany({ 'background-image': '', 'background-size': '' }, 'Background: colour');
    if (t === 'gradient' && !/gradient/.test(img)) setGrad();
    if (t === 'image' && !/url\(/.test(img)) ctx.setMany({ 'background-image': `url("${IMG_NEW}")`, 'background-size': 'cover' }, 'Background: image');
  };
  const colorOnly = { own: {}, inherit: () => null, comp: {} };
  return html`
    <${ButtonGroup} label="Background type" value=${type} onChange=${pickType} showText=${true}
      items=${[{ id: 'color', text: 'Color', icon: 'fill' }, { id: 'gradient', text: 'Gradient', icon: 'gradient' }, { id: 'image', text: 'Image', icon: 'image' }]} />
    <${StyleField} ctx=${ctx} prop="background-color" cfg=${{ label: 'Color', kind: 'color', vars: true, connected: 'color' }} />
    ${type === 'gradient' && html`
      <${Two}>
        <${FormField} name="grad-a" label="Start" kind="color" defaultValue=${(g[2] || '#8B7BE8').trim()} onCommit=${v => setGrad(g[1], v, g[3])} />
        <${FormField} name="grad-b" label="End" kind="color" defaultValue=${(g[3] || '#0E1424').trim()} onCommit=${v => setGrad(g[1], g[2], v)} />
      <//>
      <${FormField} name="grad-angle" label="Angle" kind="text" defaultValue=${g[1] || '135deg'} onCommit=${v => setGrad(/deg$/.test(v) ? v : (parseFloat(v) || 0) + 'deg', g[2], g[3])} />`}
    ${type === 'image' && html`
      <${FormField} name="bg-url" label="Image URL" kind="text" placeholder="Built-in illustration" defaultValue=${/data:/.test(img) ? '' : (img.match(/url\("?([^")]+)"?\)/) || [])[1] || ''}
        onCommit=${v => ctx.set('background-image', `url("${v || IMG_NEW}")`)} />
      <${StyleField} ctx=${ctx} prop="background-size" cfg=${{ label: 'Fit', mode: 'dropdown', kind: 'text', options: OPT([['cover', 'Cover'], ['contain', 'Contain'], ['auto', 'Original size']]) }} />`}
    <${StyleField} ctx=${ctx} prop="background-blend-mode" cfg=${{ label: 'Blend Mode', mode: 'dropdown', kind: 'text', options: BLENDS }} />`;
}

function BorderFields({ ctx }) {
  const anySide = SIDE_PROPS.some(s => ctx.own[`border-${s}-width`]);
  const anyCorner = CORNERS.some(c => ctx.own[`border-${c[0]}-radius`]);
  const [sides, setSides] = useState(anySide);
  const [corners, setCorners] = useState(anyCorner);
  const sideIcon = { left: 'borderLeft', right: 'borderRight', top: 'borderTop', bottom: 'borderBottom' };
  const side = s => html`<${StyleField} ctx=${ctx} prop=${`border-${s}-width`} cfg=${{ label: s[0].toUpperCase() + s.slice(1), icon: sideIcon[s], neg: false, auto: false, vars: true }} />`;
  const corner = ([k, label, icon]) => html`<${StyleField} ctx=${ctx} prop=${`border-${k}-radius`} cfg=${{ label, icon, neg: false, auto: false, vars: true }} />`;
  return html`
    <div className="slot" style=${{ gap: 16 }}>
      <${StyleField} ctx=${ctx} prop="border-width" cfg=${{ label: 'Width', neg: false, auto: false, connected: 'action', onAction: () => setSides(v => !v), actionIcon: 'borderOuter', actionLabel: sides ? 'Hide individual sides' : 'Set each side', actionPressed: sides }} />
      ${sides && html`<${Two}>${side('left')}${side('right')}<//><${Two}>${side('top')}${side('bottom')}<//>`}
    </div>
    <${StyleSegments} ctx=${ctx} prop="border-style" label="Style"
      items=${[{ id: 'none', text: 'None', icon: 'close' }, { id: 'solid', text: 'Solid', icon: 'lineSolid' }, { id: 'dashed', text: 'Dashed', icon: 'lineDashed' }, { id: 'dotted', text: 'Dotted', icon: 'lineDotted' }]} />
    <${StyleField} ctx=${ctx} prop="border-color" cfg=${{ label: 'Color', kind: 'color', vars: true, connected: 'color' }} />
    <div className="slot" style=${{ gap: 16 }}>
      <${StyleField} ctx=${ctx} prop="border-radius" cfg=${{ label: 'Radius', neg: false, auto: false, vars: true, connected: 'action', onAction: () => setCorners(v => !v), actionIcon: 'cropFree', actionLabel: corners ? 'Hide individual corners' : 'Set each corner', actionPressed: corners }} />
      ${corners && html`<${Two}>${corner(CORNERS[0])}${corner(CORNERS[1])}<//><${Two}>${corner(CORNERS[2])}${corner(CORNERS[3])}<//>`}
    </div>`;
}

function Controls({ ctx, node, openSecs, toggleSec }) {
  const disp = ctx.own.display || ctx.inherit('display')?.v || ctx.comp.display || '';
  const isFlex = /flex/.test(disp), isGrid = /grid/.test(disp);
  const sec = (id, body) => html`<${Section} key=${id} id=${id} ctx=${ctx} open=${!!openSecs[id]} onToggle=${o => toggleSec(id, o)}>${body}<//>`;
  const side = (pre) => Object.fromEntries(SIDES.map(s => [s, ctx.own[`${pre}-${s}`] || '']));
  const sidePh = (pre) => Object.fromEntries(SIDES.map(s => [s, fmtComputed(`${pre}-${s}`, ctx.comp[`${pre}-${s}`]) || '0']));
  const isImg = node.type === 'image';
  return html`<div className="secs">
    ${!isImg && sec('typography', html`
      <${StyleField} ctx=${ctx} prop="font-family" cfg=${{ label: 'Font Family', mode: 'dropdown', kind: 'text', options: OPT(FONTS) }} />
      <${Two}>
        <${StyleField} ctx=${ctx} prop="font-size" cfg=${{ label: 'Size', vars: true, units: ['px', 'rem', 'em'], neg: false, auto: false }} />
        <${StyleField} ctx=${ctx} prop="font-weight" cfg=${{ label: 'Weight', mode: 'dropdown', kind: 'text', options: WEIGHTS }} />
      <//>
      <${StyleField} ctx=${ctx} prop="color" cfg=${{ label: 'Color', kind: 'color', vars: true, connected: 'color' }} />
      <${StyleSegments} ctx=${ctx} prop="text-align" label="Align"
        items=${[{ id: 'left', text: 'Left', icon: 'alignLeft' }, { id: 'center', text: 'Center', icon: 'alignCenter' }, { id: 'right', text: 'Right', icon: 'alignRight' }, { id: 'justify', text: 'Justify', icon: 'alignJustify' }]} />
      <${Two}>
        <${StyleField} ctx=${ctx} prop="line-height" cfg=${{ label: 'Line Height', unit: '', neg: false, auto: false, keywords: ['normal'], units: ['', 'px', '%'] }} />
        <${StyleField} ctx=${ctx} prop="letter-spacing" cfg=${{ label: 'Letter spacing', auto: false, keywords: ['normal'], units: ['px', 'em'] }} />
      <//>
      <${StyleSegments} ctx=${ctx} prop="text-decoration" label="Decoration"
        items=${[{ id: 'none', text: 'None', icon: 'remove' }, { id: 'underline', text: 'Underline', icon: 'underline' }, { id: 'line-through', text: 'Strikethrough', icon: 'strike' }]} />
      <${StyleSegments} ctx=${ctx} prop="font-style" label="Style"
        items=${[{ id: 'normal', text: 'Normal', icon: 'remove' }, { id: 'italic', text: 'Italic', icon: 'italic' }]} />
    `)}
    ${sec('background', html`<${BackgroundFields} ctx=${ctx} />`)}
    ${sec('display', html`
      <${Two}>
        <${StyleField} ctx=${ctx} prop="display" cfg=${{ label: 'Display', mode: 'dropdown', kind: 'text', options: DISPLAYS }} />
        <${StyleField} ctx=${ctx} prop="position" cfg=${{ label: 'Position', mode: 'dropdown', kind: 'text', options: POSITIONS }} />
      <//>
      ${isFlex && html`<${StyleSegments} ctx=${ctx} prop="flex-direction" label="Direction" showText=${true}
          items=${[{ id: 'row', text: 'Row', icon: 'rowDir' }, { id: 'column', text: 'Column', icon: 'colDir' }]} />`}
      ${(isFlex || isGrid) && html`
        <${StyleSegments} ctx=${ctx} prop="justify-content" label="Justify Content" items=${JUSTIFY} />
        <${StyleSegments} ctx=${ctx} prop="align-items" label="Align Items" items=${ALIGN4('flex-start', 'flex-end')} />
        <${StyleSegments} ctx=${ctx} prop="align-content" label="Align Content" items=${ALIGN4('flex-start', 'flex-end')} />
        <${Two}>
          <${StyleField} ctx=${ctx} prop="row-gap" cfg=${{ label: 'Row Gap', vars: true, neg: false, auto: false, keywords: ['normal'] }} />
          <${StyleField} ctx=${ctx} prop="column-gap" cfg=${{ label: 'Column Gap', vars: true, neg: false, auto: false, keywords: ['normal'] }} />
        <//>`}
      ${isGrid && html`
        <${StyleSegments} ctx=${ctx} prop="justify-items" label="Justify Items" items=${ALIGN4('start', 'end')} />
        <${Two}>
          <${StyleField} ctx=${ctx} prop="grid-template-columns" cfg=${{ label: 'Grid Columns', kind: 'text', placeholder: 'repeat(3, 1fr)' }} />
          <${StyleField} ctx=${ctx} prop="grid-template-rows" cfg=${{ label: 'Grid Rows', kind: 'text', placeholder: 'auto' }} />
        <//>
        <${Two}>
          <${StyleField} ctx=${ctx} prop="grid-auto-columns" cfg=${{ label: 'Auto Columns', kind: 'text', placeholder: 'auto' }} />
          <${StyleField} ctx=${ctx} prop="grid-auto-rows" cfg=${{ label: 'Auto Rows', kind: 'text', placeholder: 'auto' }} />
        <//>
        <${StyleField} ctx=${ctx} prop="grid-auto-flow" cfg=${{ label: 'Auto Flow', mode: 'dropdown', kind: 'text', options: FLOWS }} />`}
    `)}
    ${sec('size', html`
      <${Two}>
        <${StyleField} ctx=${ctx} prop="width" cfg=${{ label: 'Width', neg: false, vars: true }} />
        <${StyleField} ctx=${ctx} prop="height" cfg=${{ label: 'Height', neg: false, vars: true }} />
      <//>
      <${Two}>
        <${StyleField} ctx=${ctx} prop="min-width" cfg=${{ label: 'Min Width', neg: false, vars: true }} />
        <${StyleField} ctx=${ctx} prop="min-height" cfg=${{ label: 'Min Height', neg: false, vars: true }} />
      <//>
      <${Two}>
        <${StyleField} ctx=${ctx} prop="max-width" cfg=${{ label: 'Max Width', neg: false, auto: false, keywords: ['none'], vars: true }} />
        <${StyleField} ctx=${ctx} prop="max-height" cfg=${{ label: 'Max Height', neg: false, auto: false, keywords: ['none'], vars: true }} />
      <//>
    `)}
    ${sec('spacing', html`
      <${MarginPadding} initialMargin=${side('margin')} initialPadding=${side('padding')} placeholders=${{ margin: sidePh('margin'), padding: sidePh('padding') }}
        onChange=${ch => { const [box, v] = Object.entries(ch)[0]; ctx.setMany(Object.fromEntries(SIDES.map(s => [`${box}-${s}`, v[s] || '']))); }} />
    `)}
    ${sec('border', html`<${BorderFields} ctx=${ctx} />`)}
  </div>`;
}

function GeneralTab({ node, doc, update }) {
  const tagOpts = node.type === 'heading' ? ['h1', 'h2', 'h3', 'h4', 'h5', 'h6'] : node.type === 'text' ? ['p', 'span', 'blockquote'] : node.type === 'block' ? ['div', 'section', 'nav', 'header', 'footer', 'article'] : null;
  const setNode = (patch, label) => update(d => ({ ...d, nodes: { ...d.nodes, [node.id]: { ...d.nodes[node.id], ...patch } } }), label);
  return html`<div className="gen">
    <${FormField} name="el-name" label="Name in tree" kind="text" defaultValue=${node.name} placeholder="Element name" onCommit=${v => setNode({ name: v || node.type }, 'Rename element')} />
    ${tagOpts && html`<${FormField} name="el-tag" label="HTML tag" mode="dropdown" kind="text" options=${OPT(tagOpts)} defaultValue=${node.tag} onCommit=${v => v && setNode({ tag: v }, 'Change tag')} />`}
    ${TEXTUAL(node.type) && html`<${TextArea} label="Text" defaultValue=${node.text} placeholder="Text content" allowVariables=${false} helperText="Tip: double-click the text on the canvas to edit it in place" onCommit=${v => v !== node.text && setNode({ text: v }, 'Edit text')} />`}
    ${node.type === 'link' && html`<${FormField} name="el-href" label="Link URL" kind="text" defaultValue=${node.href} placeholder="https://" onCommit=${v => setNode({ href: v }, 'Change link')} />`}
    ${node.type === 'image' && html`
      <${FormField} name="el-src" label="Image source" kind="text" defaultValue=${node.src.startsWith('data:') ? '' : node.src} placeholder="Built-in illustration" helperText="Only images on this page can load in the preview" showHelper=${true} onCommit=${v => setNode({ src: v || IMG_NEW }, 'Change image')} />
      <${TextArea} label="Alt text" defaultValue=${node.alt} placeholder="Describe the image" allowVariables=${false} showHelper=${false} height=${60} onCommit=${v => setNode({ alt: v }, 'Change alt text')} />`}
    <${Info} text=${`ID: ${node.id}. Styles you set here apply to this element only.`} />
  </div>`;
}

const STATE_OPTS = STATES.map(s => ({ id: s.id, value: s.id, label: s.id === 'normal' ? 'Default' : s.text }));

function StylePanel({ doc, sel, bp, st, setSt, tab, setTab, mode, setMode, update, extRev, openSecs, toggleSec, addNode }) {
  const node = doc.nodes[sel];
  const [comp, setComp] = useState({});
  useLayoutEffect(() => {
    const el = document.querySelector(`.site [data-el="${sel}"], .site[data-el="${sel}"]`);
    if (!el) { setComp({}); return; }
    const cs = getComputedStyle(el); const out = {};
    Object.values(SECTIONS).flat().forEach(p => out[p] = cs.getPropertyValue(p));
    setComp(prev => JSON.stringify(prev) === JSON.stringify(out) ? prev : out);
  });
  if (!node) return html`<div className="empty-sel"><b>Nothing selected</b><span>Click an element on the canvas or in the Elements Tree.</span></div>`;
  const own = levelOf(doc, sel, bp, st);
  const setMany = (patch, label) => update(d => {
    const s = d.styles[sel] || {}; const lvl = { ...((s[bp] || {})[st] || {}) };
    Object.entries(patch).forEach(([k, v]) => { if (v) lvl[k] = v; else delete lvl[k]; });
    return { ...d, styles: { ...d.styles, [sel]: { ...s, [bp]: { ...(s[bp] || {}), [st]: lvl } } } };
  }, label || `Change ${Object.keys(patch).join(', ')}`, `${sel}|${bp}|${st}|${Object.keys(patch).join()}`);
  const ctx = {
    own, comp, inherit: p => inheritedOf(doc, sel, bp, st, p),
    set: (p, v) => setMany({ [p]: v }, v ? `Set ${p}` : `Reset ${p}`), setMany,
  };
  const hasCss = Object.keys(own).length > 0;
  const rawCss = `:root {\n${Object.entries(own).map(([k, v]) => `  ${k}: ${v};`).join('\n')}${Object.keys(own).length ? '\n' : ''}}`;
  const applyRaw = (decls, ok) => {
    if (!ok) return;
    const next = Object.fromEntries(decls);
    if (JSON.stringify(next) === JSON.stringify(own)) return;
    update(d => { const s = d.styles[sel] || {}; return { ...d, styles: { ...d.styles, [sel]: { ...s, [bp]: { ...(s[bp] || {}), [st]: next } } } }; }, 'Edit raw CSS', `raw|${sel}|${bp}|${st}`);
  };
  const key = `${sel}|${bp}|${st}|${extRev}`;
  return html`<${ScrollArea} className="left-sa" inset=${40}>
    <div className="sp-ui">
      <div className="sp-head">
        <b>${node.name}</b>
        <${MenuButton} render=${close => html`<${PopoverPanel} type="options-list" items=${NEW_TYPES} value=${null} listLabel="Add element"
            onSelect=${o => { close(); addNode(o.id); }} />`}>${(open, toggle) => html`<${Button} size="big" icon="add" onClick=${toggle}>Add Element<//>`}<//>
      </div>
      <div className="sp-row">
        <${ButtonGroup} showLabel=${false} ariaLabel="Panel" value=${tab} onChange=${setTab}
          items=${[{ id: 'general', text: 'General', icon: 'settings' }, { id: 'style', text: 'Style', icon: 'palette' }]} />
      </div>
      ${tab === 'style' && html`
        <div className="sp-row">
          <${FormField} key=${'state-' + st + sel} name="state" label="State" mode="dropdown" kind="text" noBadge=${true} options=${STATE_OPTS}
            defaultValue=${st} onCommit=${v => v && setSt(v)} />
        </div>
        <div className="sp-row">
          <${ButtonGroup} showLabel=${false} ariaLabel="Editor" value=${mode} onChange=${setMode} badge=${hasCss ? 'default' : null}
            showHelper=${hasCss} helper="Element has options set via CSS"
            items=${[{ id: 'controls', text: 'Controls', icon: 'tune' }, { id: 'raw', text: 'Raw CSS', icon: 'code' }]} />
        </div>`}
      ${tab === 'general' ? html`<${GeneralTab} key=${sel + '|' + extRev} node=${node} doc=${doc} update=${update} />`
        : mode === 'controls' ? html`<${Controls} key=${key} ctx=${ctx} node=${node} openSecs=${openSecs} toggleSec=${toggleSec} />`
          : html`<div className="sp-row"><${CodeArea} key=${key} label="Raw CSS" showLabel=${false} defaultValue=${rawCss} showScrollbar=${true}
              helperText=${`Declarations inside :root apply to ${node.name} · ${BP_LABEL[bp]}${st !== 'normal' ? ' · ' + st : ''}`} onParsed=${applyRaw} /></div>`}
    </div>
  <//>`;
}

/* ======================================================================
   Canvas
   ====================================================================== */
function SiteNode({ doc, id, editing, onEditDone, forced }) {
  const n = doc.nodes[id]; if (!n) return null;
  const cls = n.cls ? n.cls.split(' ').map(c => c.startsWith('s-') ? c : 's-' + c).join(' ') : '';
  const common = { 'data-el': id, className: cls, key: id };
  if (forced && forced.id === id) common['data-force'] = forced.st;
  if (n.type === 'image') return html`<img ...${common} src=${n.src} alt=${n.alt} draggable=${false} />`;
  if (TEXTUAL(n.type)) {
    const isEdit = editing === id;
    const extra = n.type === 'link' ? { href: n.href || '#', onClick: e => e.preventDefault() } : {};
    return React.createElement(n.tag, {
      ...common, ...extra, contentEditable: isEdit ? 'true' : undefined, suppressContentEditableWarning: true,
      onBlur: isEdit ? e => onEditDone(id, e.currentTarget.innerText) : undefined,
      onKeyDown: isEdit ? e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.currentTarget.blur(); } if (e.key === 'Escape') { e.preventDefault(); e.currentTarget.innerText = n.text; onEditDone(id, null); } e.stopPropagation(); } : undefined,
    }, n.text);
  }
  return React.createElement(n.tag, common, n.children.map(c => html`<${SiteNode} key=${c} doc=${doc} id=${c} editing=${editing} onEditDone=${onEditDone} forced=${forced} />`));
}

function useRect(ref, deps) {
  const [r, setR] = useState(null);
  useLayoutEffect(() => {
    const measure = () => { const f = ref.current?.(); setR(f); };
    measure();
    const t = setTimeout(measure, 220);
    window.addEventListener('resize', measure);
    return () => { clearTimeout(t); window.removeEventListener('resize', measure); };
  }, deps);
  return r;
}

function Canvas({ doc, sel, setSel, hover, setHover, bp, st, editing, setEditing, commitText, preview, outlines, removeNode, openGeneral, selectParent }) {
  const frameRef = useRef(null), hostRef = useRef(null), scrollRef = useRef(null);
  const [avail, setAvail] = useState(900);
  const [frameH, setFrameH] = useState(800);
  const W = BPS.find(b => b.id === bp).w;
  const scale = Math.min(1, (avail - 48) / W);
  useLayoutEffect(() => {
    const ro = new ResizeObserver(() => { setAvail(scrollRef.current.clientWidth); setFrameH(frameRef.current.offsetHeight); });
    ro.observe(scrollRef.current); ro.observe(frameRef.current);
    return () => ro.disconnect();
  }, []);
  const forced = sel && st !== 'normal' ? { id: sel, st } : null;
  const css = useMemo(() => genCss(doc, { forced }), [doc, sel, st]);
  const rectOf = id => {
    if (!id || !hostRef.current) return null;
    const el = hostRef.current.querySelector(id === doc.root ? `.site[data-el="${id}"]` : `.site [data-el="${id}"]`); if (!el) return null;
    const h = hostRef.current.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height };
  };
  const [tick, setTick] = useState(0);
  const selR = useRect({ current: () => rectOf(sel) }, [sel, doc, bp, st, scale, frameH, tick, avail]);
  const hovR = hover && hover !== sel ? rectOf(hover) : null;
  useEffect(() => { const i = setInterval(() => setTick(t => t + 1), 800); return () => clearInterval(i); }, []);
  const pick = e => { if (preview) return; const el = e.target.closest('[data-el]'); return el?.getAttribute('data-el'); };
  const onMove = e => { const id = pick(e); if (id !== hover) setHover(id || null); };
  const onClick = e => { if (preview) return; if (e.target.closest('[contenteditable=true]')) return; e.preventDefault(); const id = pick(e); if (id) setSel(id); };
  const onDbl = e => { const id = pick(e); if (id && TEXTUAL(doc.nodes[id]?.type)) { setSel(id); setEditing(id); } };
  useEffect(() => {
    if (!editing) return;
    const el = hostRef.current?.querySelector(`[data-el="${editing}"]`);
    if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  }, [editing]);
  const n = doc.nodes[sel];
  const barAbove = selR && selR.y > 30;
  return html`<div className="cv-scroll" ref=${scrollRef}>
    <div className="cv-inner" style=${{ minHeight: '100%' }}>
      <div className="cv-frame-host" ref=${hostRef} style=${{ width: W * scale, height: frameH * scale }}>
        <style>${css}</style>
        <div className="cv-frame" ref=${frameRef} style=${{ width: W, transform: `scale(${scale})` }}>
          <div className=${cx('site', !preview && 'selecting', outlines && !preview && 'outlines')} data-el=${doc.root}
            onPointerMove=${onMove} onPointerLeave=${() => setHover(null)} onClick=${onClick} onDoubleClick=${onDbl}>
            ${doc.nodes[doc.root].children.map(c => html`<${SiteNode} key=${c} doc=${doc} id=${c} editing=${editing} forced=${forced}
              onEditDone=${(id, text) => { setEditing(null); if (text != null) commitText(id, text.trim()); }} />`)}
          </div>
        </div>
        ${!preview && html`<div className="ov" aria-hidden=${!selR}>
          ${hovR && html`<div className="ov-hover" style=${{ left: hovR.x, top: hovR.y, width: hovR.w, height: hovR.h }}><span>${doc.nodes[hover]?.name}</span></div>`}
          ${selR && n && sel !== doc.root && html`<${Fragment}>
            <div className="ov-sel" style=${{ left: selR.x - 1, top: selR.y - 1, width: selR.w + 2, height: selR.h + 2 }}></div>
            <div className=${cx('ov-bar', !barAbove && 'below')} style=${{ left: Math.max(0, selR.x - 1), top: barAbove ? selR.y - 27 : selR.y + selR.h + 1 }}
              onClick=${e => e.stopPropagation()}>
              <span className="grip" title="Drag to move (not in this prototype)"><${Icon} name="drag" size=${14} /></span>
              <span className="nm">${n.name}</span>
              <button type="button" aria-label="Select parent" title="Select parent" onClick=${selectParent}><${Icon} name="parent" size=${14} /></button>
              <button type="button" aria-label="Element settings" title="Element settings" onClick=${openGeneral}><${Icon} name="settings" size=${14} /></button>
              <button type="button" aria-label="Edit text" title=${TEXTUAL(n.type) ? 'Edit text' : 'Only text elements can be edited in place'} disabled=${!TEXTUAL(n.type)} onClick=${() => setEditing(sel)}><${Icon} name="edit" size=${14} /></button>
              <button type="button" aria-label="Delete element" title="Delete (Del)" onClick=${() => removeNode(sel)}><${Icon} name="trash" size=${14} /></button>
            </div>
          <//>`}
        </div>`}
      </div>
    </div>
  </div>`;
}

/* ======================================================================
   Elements tree (right)
   ====================================================================== */
function Tree({ doc, sel, setSel, hover, setHover }) {
  const [collapsed, setCollapsed] = useState(() => new Set(['nav', 'clients', 'why', 'testimonials', 'footer', 'hero-image']));
  const ref = useRef(null);
  useEffect(() => { // expand ancestors of selection
    let p = doc.nodes[sel]?.parent; const need = []; while (p) { if (collapsed.has(p)) need.push(p); p = doc.nodes[p]?.parent; }
    if (need.length) setCollapsed(c => { const n = new Set(c); need.forEach(x => n.delete(x)); return n; });
  }, [sel]);
  useEffect(() => { ref.current?.querySelector('.is-sel')?.scrollIntoView({ block: 'nearest' }); }, [sel, collapsed]);
  const rows = [];
  const walk = (id, depth) => {
    const n = doc.nodes[id]; if (!n) return;
    rows.push({ n, depth });
    if (n.children?.length && !collapsed.has(id)) n.children.forEach(c => walk(c, depth + 1));
  };
  doc.nodes[doc.root].children.forEach(c => walk(c, 0));
  const hasStyles = id => Object.values(doc.styles[id] || {}).some(b => Object.values(b).some(s => Object.keys(s).length));
  const onKey = (e, i) => {
    const r = rows[i]; let j = null;
    if (e.key === 'ArrowDown') j = Math.min(rows.length - 1, i + 1); else if (e.key === 'ArrowUp') j = Math.max(0, i - 1);
    else if (e.key === 'ArrowRight' && r.n.children?.length) { e.preventDefault(); setCollapsed(c => { const n = new Set(c); n.delete(r.n.id); return n; }); return; }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (r.n.children?.length && !collapsed.has(r.n.id)) setCollapsed(c => new Set(c).add(r.n.id)); else if (r.n.parent && r.n.parent !== doc.root) setSel(r.n.parent); return; }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSel(r.n.id); return; }
    if (j != null) { e.preventDefault(); setSel(rows[j].n.id); }
  };
  useEffect(() => { const el = ref.current?.querySelector('.is-sel'); if (el && ref.current.contains(document.activeElement)) el.focus(); }, [sel]);
  return html`<div className="tr" ref=${ref} role="tree" aria-label="Elements">
    ${rows.map(({ n, depth }, i) => { const kids = n.children?.length; const open = kids && !collapsed.has(n.id);
      const label = TEXTUAL(n.type) ? html`${n.type === 'text' && n.tag === 'p' ? html`<i>${'<p>'}</i>` : ''}${n.text}` : n.type === 'block' && n.name === 'Block' ? html`Block <i>${`<${n.tag}>`}</i>` : n.name;
      return html`<div key=${n.id} role="treeitem" aria-level=${depth + 1} aria-selected=${sel === n.id} aria-expanded=${kids ? !!open : undefined}
        tabIndex=${sel === n.id || (!sel && i === 0) ? 0 : -1}
        className=${cx('tr-row', sel === n.id && 'is-sel', hover === n.id && 'is-hover')} style=${{ paddingLeft: 4 + depth * 14 }}
        onClick=${() => setSel(n.id)} onPointerEnter=${() => setHover(n.id)} onPointerLeave=${() => setHover(null)} onKeyDown=${e => onKey(e, i)}>
        ${kids ? html`<button type="button" className="tr-chev" tabIndex=${-1} aria-label=${open ? 'Collapse' : 'Expand'} aria-expanded=${!!open}
            onClick=${e => { e.stopPropagation(); setCollapsed(c => { const s = new Set(c); s.has(n.id) ? s.delete(n.id) : s.add(n.id); return s; }); }}><${Icon} name="chevron" size=${14} /></button>` : html`<span style=${{ width: 16, flex: 'none' }}></span>`}
        <span className="tr-ic"><${Icon} name=${TYPE_ICON[n.type]} size=${15} /></span>
        <span className="tr-lbl">${label}</span>
        ${hasStyles(n.id) && html`<span className="tr-dot" title="Has custom styles"></span>`}
      </div>`; })}
  </div>`;
}

/* ======================================================================
   App
   ====================================================================== */
const NEW_TYPES = [
  { id: 'heading', value: 'Heading' }, { id: 'text', value: 'Paragraph' }, { id: 'link', value: 'Button link' },
  { id: 'image', value: 'Image' }, { id: 'block', value: 'Block' },
];
function newNode(type, id) {
  if (type === 'heading') return { id, type, name: 'Heading', tag: 'h2', cls: 'new-heading', text: 'New heading', children: [] };
  if (type === 'text') return { id, type, name: 'Paragraph', tag: 'p', cls: 'new-text', text: 'New paragraph. Double-click to edit.', children: [] };
  if (type === 'link') return { id, type, name: 'Link', tag: 'a', cls: 'btn s-btn-primary', text: 'Button', href: '#', children: [] };
  if (type === 'image') return { id, type, name: 'Image', tag: 'img', cls: 'new-img', src: IMG_NEW, alt: 'Placeholder image', children: [] };
  return { id, type: 'block', name: 'Block', tag: 'div', cls: 'new-block', children: [] };
}

function MenuButton({ render, children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  return html`<span ref=${ref} style=${{ display: 'inline-flex' }}>${children(open, () => setOpen(o => !o))}
    <${Floating} anchor=${ref} open=${open} onClose=${() => setOpen(false)}>${render(() => setOpen(false))}<//></span>`;
}

function App() {
  const saved = useMemo(() => store.get('proto:doc', null), []);
  const [hist, setHist] = useState(() => ({ past: [], present: saved || makeDoc(), future: [], lastKey: null, lastT: 0, label: '' }));
  const doc = hist.present;
  const [savedDoc, setSavedDoc] = useState(() => hist.present);
  const [extRev, setExtRev] = useState(0);
  const [sel, setSelRaw] = useState('hero-title');
  const [hover, setHover] = useState(null);
  const [bp, setBp] = useState('all');
  const [st, setSt] = useState('normal');
  const [tab, setTab] = useState('style');
  const [mode, setMode] = useState('controls');
  const [preview, setPreview] = useState(false);
  const [dev, setDev] = useState(false);
  const [outlines, setOutlines] = useState(false);
  const [editing, setEditing] = useState(null);
  const [openSecs, setOpenSecs] = useState(() => store.get('proto:secs2', { typography: true, background: true, display: true, size: true, spacing: true, border: true }));
  const [toasts, setToasts] = useState([]);
  const toast = useCallback(msg => { const id = Math.random(); setToasts(t => [...t, { id, msg }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600); }, []);
  const log = useCallback(() => { }, []);

  const update = useCallback((fn, label, key) => setHist(h => {
    const next = fn(h.present); if (next === h.present) return h;
    const now = Date.now(); const merge = key && h.lastKey === key && now - h.lastT < 1200;
    return { past: merge ? h.past : [...h.past.slice(-99), h.present], present: next, future: [], lastKey: key || null, lastT: now, label: label || '' };
  }), []);
  const undo = () => { if (!hist.past.length) return; setExtRev(r => r + 1); setHist(h => { if (!h.past.length) return h; return { past: h.past.slice(0, -1), present: h.past[h.past.length - 1], future: [h.present, ...h.future], lastKey: null, lastT: 0, label: 'Undo' }; }); };
  const redo = () => { if (!hist.future.length) return; setExtRev(r => r + 1); setHist(h => { if (!h.future.length) return h; return { past: [...h.past, h.present], present: h.future[0], future: h.future.slice(1), lastKey: null, lastT: 0, label: 'Redo' }; }); };
  const setSel = id => { setSelRaw(id); setEditing(null); };
  const selectParent = () => { const p = doc.nodes[sel]?.parent; if (p) setSel(p); };
  useEffect(() => { if (sel && !doc.nodes[sel]) setSelRaw(doc.root); }, [doc]);
  const toggleSec = (id, o) => setOpenSecs(s => { const n = { ...s, [id]: o }; store.set('proto:secs2', n); return n; });
  const dirty = doc !== savedDoc && JSON.stringify(doc) !== JSON.stringify(savedDoc);
  const save = () => { store.set('proto:doc', doc); setSavedDoc(doc); toast('Saved. Changes stay in this browser.'); };

  const commitText = (id, text) => { if (!text || text === doc.nodes[id].text) return; update(d => ({ ...d, nodes: { ...d.nodes, [id]: { ...d.nodes[id], text } } }), 'Edit text'); setExtRev(r => r + 1); };
  const removeNode = id => {
    const n = doc.nodes[id]; if (!n || id === doc.root) return;
    update(d => {
      const nodes = { ...d.nodes }; const styles = { ...d.styles };
      const kill = x => { (nodes[x]?.children || []).forEach(kill); delete nodes[x]; delete styles[x]; };
      kill(id); const p = nodes[n.parent]; nodes[n.parent] = { ...p, children: p.children.filter(c => c !== id) };
      return { ...d, nodes, styles };
    }, `Delete ${n.name}`);
    setSelRaw(n.parent); toast(`Deleted ${n.name}. Press ⌘Z to undo.`);
  };
  const addNode = type => {
    const id = `${type}-${Date.now().toString(36)}`;
    const cur = doc.nodes[sel] || doc.nodes[doc.root];
    const intoBlock = cur.type === 'block' || cur.type === 'body';
    const parentId = intoBlock ? cur.id : cur.parent;
    update(d => {
      const nodes = { ...d.nodes }; const nn = { ...newNode(type, id), parent: parentId };
      const p = nodes[parentId]; const ch = [...p.children];
      if (intoBlock) ch.push(id); else ch.splice(ch.indexOf(cur.id) + 1, 0, id);
      nodes[parentId] = { ...p, children: ch }; nodes[id] = nn;
      return { ...d, nodes };
    }, `Add ${type}`);
    setSelRaw(id); toast(`Added ${NEW_TYPES.find(t => t.id === type).value.toLowerCase()} ${intoBlock ? 'inside' : 'after'} ${cur.name}`);
  };
  const resetDemo = () => { update(() => makeDoc(), 'Reset page'); setExtRev(r => r + 1); setSelRaw('hero-title'); toast('Demo page reset. Undo is available.'); };

  useEffect(() => {
    const onKey = e => {
      const t = e.target; const typing = t.closest?.('input, textarea, [contenteditable=true]');
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
      if (typing) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && sel && !document.querySelector('.floating')) { e.preventDefault(); removeNode(sel); }
      else if (e.key === 'Escape' && !document.querySelector('.floating')) { if (preview) setPreview(false); else selectParent(); }
    };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  });

  const path = []; { let p = sel; while (p) { path.unshift(p); p = doc.nodes[p]?.parent; } }
  const devCss = useMemo(() => dev ? highlightCss(genCss(doc)).join('\n') : '', [dev, doc]);
  const lastLabel = hist.label;

  return html`<${ToastCtx.Provider} value=${toast}><${LogCtx.Provider} value=${log}>
  <div className="pr ds">
    <header className="top">
      <div className="grp">
        <span className="logo" aria-hidden="true">SB</span>
        <${Tooltip} content="Site settings" side="bottom"><${IconBtnLg} icon="settings" showText=${false} label="Site settings" onClick=${() => toast('Site settings are not part of this prototype')} /><//>
        <${MenuButton} render=${close => html`<${PopoverPanel} type="options-list" items=${NEW_TYPES} value=${null} listLabel="Add element"
            onSelect=${o => { close(); addNode(o.id); }} />`}>${(open, toggle) => html`<${Tooltip} content="Add element" side="bottom"><${Button} showText=${false} icon="add" onClick=${toggle}>Add element<//><//>`}<//>
        <${MenuButton} render=${close => html`<${PopoverPanel} type="options-list" listLabel="Tools" value=${outlines ? 'outlines' : null}
            items=${[{ id: 'outlines', value: 'Show element outlines' }, { id: 'reset', value: 'Reset demo page' }, { id: 'forget', value: 'Forget saved version' }]}
            onSelect=${o => { close(); if (o.id === 'outlines') setOutlines(v => !v); if (o.id === 'reset') resetDemo(); if (o.id === 'forget') { store.set('proto:doc', null); toast('Saved version removed from this browser'); } }} />`}>
          ${(open, toggle) => html`<${IconBtnLg} icon="wrench" text="Tools" pressed=${open} onClick=${toggle} />`}<//>
      </div>
      <span className="sp"></span>
      <div className="grp">
        <div className="bp"><${ButtonGroup} showLabel=${false} ariaLabel="Breakpoint" value=${bp} onChange=${v => { setBp(v); setExtRev(r => r + 1); }} items=${BPS} /></div>
        <${IconBtnSm} icon="edit" label="Edit breakpoints" tip="Edit breakpoints" tipSide="bottom" onClick=${() => toast('Breakpoint editing is not part of this prototype')} />
      </div>
      <span className="sp"></span>
      <div className="grp">
        <${Tooltip} content="Show generated CSS" side="bottom"><${IconBtnLg} icon="code" text="Dev" pressed=${dev} onClick=${() => setDev(v => !v)} /><//>
        <span className="vsep"></span>
        <${Tooltip} content="Undo (⌘Z)" side="bottom"><${IconBtnLg} icon="undo" showText=${false} label="Undo" disabled=${!hist.past.length} onClick=${undo} /><//>
        <${Tooltip} content="Redo (⇧⌘Z)" side="bottom"><${IconBtnLg} icon="redo" showText=${false} label="Redo" disabled=${!hist.future.length} onClick=${redo} /><//>
        <span className="vsep"></span>
        <${IconBtnLg} icon="sparkles" text="AI Assistant" onClick=${() => toast('AI Assistant is not part of this prototype')} />
        <${IconBtnLg} icon="eye" text="View" pressed=${preview} onClick=${() => setPreview(v => !v)} />
        <${Button} size="big" icon="save" onClick=${save}>${dirty ? 'Save' : 'Saved'}<//>
      </div>
    </header>
    <div className=${cx('work', preview && 'preview')}>
      <aside className="left" aria-label="Style panel">
        <${StylePanel} doc=${doc} sel=${sel} bp=${bp} st=${st} setSt=${v => { setSt(v); }} tab=${tab} setTab=${setTab} mode=${mode} setMode=${setMode}
          update=${update} extRev=${extRev} openSecs=${openSecs} toggleSec=${toggleSec} addNode=${addNode} />
      </aside>
      <main className="center" aria-label="Canvas">
        ${preview && html`<div className="preview-exit"><${IconBtnLg} icon="close" text="Exit preview (Esc)" onClick=${() => setPreview(false)} /></div>`}
        <${Canvas} doc=${doc} sel=${sel} setSel=${setSel} hover=${hover} setHover=${setHover} bp=${bp} st=${st} editing=${editing} setEditing=${setEditing}
          commitText=${commitText} preview=${preview} outlines=${outlines} removeNode=${removeNode} selectParent=${selectParent}
          openGeneral=${() => setTab('general')} />
        ${dev && !preview && html`<section className="dev" aria-label="Generated CSS">
          <div className="dev-h"><${Icon} name="code" /><span>Generated CSS</span><span className="grow"></span><${IconBtnSm} icon="close" label="Close" onClick=${() => setDev(false)} /></div>
          <pre dangerouslySetInnerHTML=${{ __html: devCss || '<span class="tk-c">/* No custom styles yet */</span>' }}></pre>
        </section>`}
        ${!preview && html`<nav className="crumbs" aria-label="Selection path">
          ${path.map((id, i) => html`<${Fragment} key=${id}>${i > 0 && html`<span className="sep">›</span>`}<button type="button" aria-current=${id === sel ? 'true' : undefined} onClick=${() => setSel(id)}>${doc.nodes[id].name}</button><//>`)}
          <span className="sp"></span>
          <span className="last">${lastLabel ? `${lastLabel}` : ''}${dirty ? ' · unsaved' : ''}</span>
        </nav>`}
      </main>
      <aside className="right" aria-label="Elements tree">
        <div className="tr-h"><span>Elements Tree</span><span className="grow"></span></div>
        <${Tree} doc=${doc} sel=${sel} setSel=${setSel} hover=${hover} setHover=${setHover} />
      </aside>
    </div>
  </div>
  <div className="narrow"><b>Style Bar Prototype</b><span>This builder prototype needs a wider window (at least 900 px). Open it on a desktop screen to edit the page.</span></div>
  <div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className="toast" key=${t.id}>${t.msg}</div>`)}</div>
  <//><//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
