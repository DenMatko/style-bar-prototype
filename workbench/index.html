<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Component workbench for the style panel prototype: every control in every state.">
<title>Style Bar Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&family=Roboto+Mono:wght@400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench shell — component list | stage (canvas + controls) | below: checks, actions, full state matrix.
   Components use the Figma tokens verbatim; the shell uses its own darker "workbench" neutrals. Deliberately dark-only (the design system has no light mode). */
:root{
  color-scheme: dark;
  /* ---- Figma tokens (Style bar UI) ---- */
  --surface-primary:#0F172A; --surface-secondary:#192133; --surface-tertiary:#1E293B;
  --bg-disable:#334155; --bg-primary-xdark:#0C2B4F; --bg-secondary:#1AE07C; --bg-secondary-light:#B7FBD8;
  --bg-destructive:#FF6D69; --bg-destructive-light:#FFC8C7;
  --text-primary:#F8FAFC; --text-secondary:#94A3B8; --text-caption:#64748B; --text-link:#56A3F5;
  --fg-secondary:#1AE07C; --fg-destructive:#FF6D69; --fg-invert:#0F172A;
  --stroke-primary:#94A3B8; --stroke-accent:#56A3F5; --stroke-destructive:#FF6D69; --stroke-attention:#F2D23C;
  --stroke-success:#1AE07C; --stroke-divider:#475569; --stroke-disabled:#334155;
  --shadow1:0 0 10px 4px #000316;
  --checker:repeating-conic-gradient(#D4D8DE 0 25%, #F4F5F7 0 50%) 0 0/8px 8px;
  --font-ui:'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-code:'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  /* ---- Workbench chrome ---- */
  --wb-bg:#070B14; --wb-panel:#0B111E; --wb-raise:#101828; --wb-line:#1B2436; --wb-line-2:#26324A;
  --wb-text:#E6EBF2; --wb-dim:#8391A7; --wb-faint:#56637A; --wb-accent:#56A3F5;
  --wb-ok:#1AE07C; --wb-bad:#FF6D69; --wb-warn:#F2D23C;
  --font-chrome:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:var(--wb-bg);color:var(--wb-text);font:400 14px/1.5 var(--font-chrome);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ================= Workbench shell ================= */
#app{height:100%}
.wb{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.side{background:var(--wb-panel);border-right:1px solid var(--wb-line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--wb-line)}
.brand h1{margin:0;font:600 17px/1.2 var(--font-chrome);letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--wb-dim);font-size:12.5px}
.progress{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.progress-bar{height:4px;border-radius:2px;background:var(--wb-line-2);overflow:hidden;display:flex}
.progress-bar span{display:block;height:100%}
.progress-meta{display:flex;justify-content:space-between;font:500 11px/1 var(--font-mono);color:var(--wb-dim);letter-spacing:.02em}
.search{margin:12px 12px 4px;position:relative}
.search input{width:100%;height:32px;padding:0 10px 0 30px;border-radius:6px;border:1px solid var(--wb-line-2);background:var(--wb-bg);color:var(--wb-text);font:inherit;font-size:13px;outline:0}
.search input:focus{border-color:var(--wb-accent)}
.search svg{position:absolute;left:9px;top:8px;color:var(--wb-faint)}
.nav{flex:1;overflow:auto;padding:4px 8px 24px;scrollbar-width:thin;scrollbar-color:var(--wb-line-2) transparent}
.nav-group{margin-top:14px}
.nav-group h2{margin:0 0 4px;padding:0 12px;font:500 10.5px/1.6 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wb-faint)}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:6px 12px;border:0;background:none;color:var(--wb-dim);border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--wb-raise);color:var(--wb-text)}
.nav-item[aria-current=page]{background:var(--wb-raise);color:var(--wb-text);box-shadow:inset 0 0 0 1px var(--wb-line-2)}
.nav-item:focus-visible{outline:2px solid var(--wb-accent);outline-offset:-2px}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:12.5px}
.qdot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--wb-faint)}
.qdot[data-q=ok]{background:var(--wb-ok);box-shadow:none}
.qdot[data-q=fix]{background:var(--wb-bad);box-shadow:none}
.qdot[data-q=wip]{background:var(--wb-warn);box-shadow:none}
.mobile-nav{display:none}

.main{min-width:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--wb-line-2) transparent}
.page{max-width:1280px;margin:0 auto;padding-block:28px 64px;padding-inline:32px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.phead-l{min-width:0;flex:1 1 420px}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wb-faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow a{color:var(--wb-accent);text-decoration:none;letter-spacing:.02em;text-transform:none}
.eyebrow a:hover{text-decoration:underline}
.phead h2{margin:10px 0 6px;font:600 28px/1.1 var(--font-mono);letter-spacing:-.02em;text-wrap:balance}
.phead p{margin:0;color:var(--wb-dim);max-width:68ch}
.qa{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qa-label{font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wb-faint)}
.qa-seg{display:flex;border:1px solid var(--wb-line-2);border-radius:8px;padding:3px;gap:2px;background:var(--wb-panel)}
.qa-seg button{border:0;background:none;color:var(--wb-dim);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:6px}
.qa-seg button:hover{color:var(--wb-text)}
.qa-seg button[aria-pressed=true]{background:var(--wb-raise);color:var(--wb-text);box-shadow:inset 0 0 0 1px var(--wb-line-2)}
.qa-seg button:focus-visible{outline:2px solid var(--wb-accent);outline-offset:0}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--wb-line);border-radius:12px;overflow:hidden;background:var(--wb-panel)}
.canvas-wrap{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--wb-line)}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;height:40px;border-bottom:1px solid var(--wb-line);font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--wb-faint)}
.bar .sp{flex:1}
.bar button{font:500 11px/1 var(--font-mono);letter-spacing:.02em;text-transform:none;color:var(--wb-dim);background:none;border:1px solid var(--wb-line-2);border-radius:5px;padding:5px 8px;cursor:pointer}
.bar button:hover{color:var(--wb-text);border-color:var(--wb-faint)}
.bar button:focus-visible{outline:2px solid var(--wb-accent)}
.canvas{position:relative;flex:1;min-height:360px;display:flex;align-items:center;justify-content:center;padding:40px 24px;background-color:var(--surface-primary);background-image:radial-gradient(circle at 1px 1px,#1F2A40 1px,transparent 1.2px);background-size:16px 16px;overflow:auto}
.canvas.top{align-items:flex-start}
.frame{position:relative;max-width:100%}
.frame[data-w]::before{content:attr(data-w);position:absolute;top:-22px;left:0;font:400 10.5px/1 var(--font-mono);color:var(--wb-faint)}
.controls{display:flex;flex-direction:column;min-width:0;background:var(--wb-panel)}
.ctl-list{display:flex;flex-direction:column;padding:8px 0;overflow:auto;max-height:640px}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:6px 16px}
.ctl label,.ctl .cl{font:400 12px/1.3 var(--font-mono);color:var(--wb-dim);overflow:hidden;text-overflow:ellipsis}
.ctl input[type=text],.ctl select{width:100%;height:28px;border-radius:5px;border:1px solid var(--wb-line-2);background:var(--wb-bg);color:var(--wb-text);font:400 12.5px/1 var(--font-chrome);padding:0 8px;outline:0}
.ctl input[type=text]:focus,.ctl select:focus{border-color:var(--wb-accent)}
.ctl-seg{display:flex;flex-wrap:wrap;gap:3px}
.ctl-seg button{border:1px solid var(--wb-line-2);background:var(--wb-bg);color:var(--wb-dim);border-radius:5px;padding:4px 7px;font:400 11.5px/1.1 var(--font-mono);cursor:pointer}
.ctl-seg button:hover{color:var(--wb-text)}
.ctl-seg button[aria-pressed=true]{border-color:var(--wb-accent);color:var(--wb-text);background:#0E1F38}
.ctl-seg button:focus-visible,.switch:focus-visible{outline:2px solid var(--wb-accent);outline-offset:1px}
.switch{width:32px;height:18px;border-radius:9px;border:0;background:var(--wb-line-2);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--wb-dim);transition:transform .15s, background .15s}
.switch[aria-checked=true]{background:#0E3A6B}
.switch[aria-checked=true]::after{transform:translateX(14px);background:var(--wb-accent)}
.ctl-sep{margin:8px 16px 2px;font:500 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wb-faint)}
.ctl-empty{padding:16px;color:var(--wb-faint);font-size:13px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.card{border:1px solid var(--wb-line);border-radius:12px;background:var(--wb-panel);min-width:0;display:flex;flex-direction:column}
.card .bar{border-bottom:1px solid var(--wb-line)}
.checks{list-style:none;margin:0;padding:8px 8px 12px}
.checks li label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--wb-dim);font-size:13.5px;line-height:1.45}
.checks li label:hover{background:var(--wb-raise);color:var(--wb-text)}
.checks input{appearance:none;flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;border:1.5px solid var(--wb-faint);display:grid;place-items:center;cursor:pointer}
.checks input:checked{background:var(--wb-ok);border-color:var(--wb-ok)}
.checks input:checked::after{content:"";width:8px;height:4px;border:2px solid #04120B;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:focus-visible{outline:2px solid var(--wb-accent);outline-offset:2px}
.checks li.done label{color:var(--wb-faint);text-decoration:line-through;text-decoration-color:var(--wb-line-2)}
.checks kbd,.phead kbd,.note kbd{font:500 11px/1 var(--font-mono);padding:2px 5px;border-radius:4px;border:1px solid var(--wb-line-2);color:var(--wb-text);background:var(--wb-bg)}
.log{list-style:none;margin:0;padding:6px 0;font:400 12px/1.5 var(--font-mono);max-height:300px;overflow:auto;flex:1}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:3px 16px}
.log li:first-child{background:#0E1F38}
.log time{color:var(--wb-faint)}
.log .ev{color:var(--wb-accent)}
.log .pl{color:var(--wb-dim);word-break:break-word}
.log-empty{padding:16px;color:var(--wb-faint);font-size:13px}

.matrix-scroll{overflow-x:auto;padding:20px;background:var(--surface-primary);border-radius:0 0 12px 12px;scrollbar-width:thin;scrollbar-color:var(--wb-line-2) transparent}
.matrix{display:grid;gap:18px 28px;align-items:start;width:max-content}
.mx-h{font:500 10.5px/1.3 var(--font-mono);letter-spacing:.04em;color:var(--wb-faint);text-transform:none;align-self:end}
.mx-r{font:500 11px/1.3 var(--font-mono);color:var(--wb-dim);align-self:center;white-space:nowrap}
.mx-c{pointer-events:none;user-select:none}
.mx-c.live{pointer-events:auto}
.issues{margin:0;padding:12px 16px 16px 34px;display:flex;flex-direction:column;gap:6px;color:var(--wb-dim);font-size:13.5px}
.issues li::marker{color:var(--wb-bad)}
.note{padding:12px 16px 16px;color:var(--wb-dim);font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0}
.tag{font:500 10.5px/1 var(--font-mono);padding:3px 6px;border-radius:4px;border:1px solid var(--wb-line-2);color:var(--wb-dim)}
.tag.inf{color:var(--wb-warn);border-color:#4A4224}

/* tokens page */
.tok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:16px}
.tok{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;border:1px solid var(--wb-line)}
.tok-sw{width:36px;height:36px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tok b{display:block;font:500 12px/1.3 var(--font-mono);color:var(--wb-text)}
.tok span{font:400 11.5px/1.3 var(--font-mono);color:var(--wb-dim)}
.scale{display:flex;flex-direction:column;gap:8px;padding:16px}
.scale-row{display:grid;grid-template-columns:120px 40px minmax(0,1fr);gap:12px;align-items:center;font:400 12px/1 var(--font-mono);color:var(--wb-dim)}
.scale-row i{display:block;height:12px;background:var(--text-link);border-radius:2px;opacity:.7}

@media (max-width: 1080px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .canvas-wrap{border-right:0;border-bottom:1px solid var(--wb-line)}
  .ctl-list{max-height:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  .wb{grid-template-columns:minmax(0,1fr);height:auto}
  .side{display:none}
  .main{overflow:visible}
  .mobile-nav{display:flex;flex-direction:column;gap:8px;padding:16px 16px 0}
  .mobile-nav select{height:38px;border-radius:8px;border:1px solid var(--wb-line-2);background:var(--wb-panel);color:var(--wb-text);font:500 14px var(--font-mono);padding:0 10px}
  .page{padding-inline:16px;padding-block:16px 48px}
  .phead h2{font-size:22px}
  .canvas{padding:32px 16px;min-height:280px}
  .ctl{grid-template-columns:96px minmax(0,1fr)}
}

/* ================= Design-system components (.ds) ================= */
.ds{font:400 12px/1.35 var(--font-ui);color:var(--text-primary);text-align:left}
.ds .ic{display:block;flex:none}
.ds :focus-visible{outline:2px solid var(--stroke-accent);outline-offset:1px}

/* badge-change */
.badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg-secondary);flex:none}
.badge[data-type=inherited]{background:var(--stroke-attention)}
.badge[data-type=error]{background:var(--fg-destructive)}

/* info */
.info{display:flex;gap:8px;align-items:flex-start;color:var(--text-secondary)}
.info .ic{color:var(--text-caption)}

/* tooltip */
.tt-anchor{position:relative;display:inline-flex}
.tt{position:absolute;z-index:40;background:var(--surface-tertiary);color:var(--text-primary);padding:4px 6px;border-radius:4px;white-space:nowrap;font:400 12px/1.35 var(--font-ui);pointer-events:none;box-shadow:0 2px 8px rgba(0,3,22,.5)}
.tt::after{content:"";position:absolute;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
.tt[data-side=top]{bottom:calc(100% + 8px);left:50%;translate:-50% 0}
.tt[data-side=top]::after{top:calc(100% - 4px);left:calc(50% - 4px)}
.tt[data-side=bottom]{top:calc(100% + 8px);left:50%;translate:-50% 0}
.tt[data-side=bottom]::after{bottom:calc(100% - 4px);left:calc(50% - 4px)}
.tt[data-side=left]{right:calc(100% + 8px);top:50%;translate:0 -50%}
.tt[data-side=left]::after{left:calc(100% - 4px);top:calc(50% - 4px)}
.tt[data-side=right]{left:calc(100% + 8px);top:50%;translate:0 -50%}
.tt[data-side=right]::after{right:calc(100% - 4px);top:calc(50% - 4px)}
.tt.static{position:relative;inset:auto;translate:none;display:inline-block;box-shadow:none}
.tt-in{animation:ttIn .12s ease-out}
@keyframes ttIn{from{opacity:0}to{opacity:1}}

/* scrollbar */
.sa{position:relative}
.sa-vp{overflow:auto;scrollbar-width:none;height:100%;max-height:inherit}
.sa-vp::-webkit-scrollbar{display:none}
.sb{position:absolute;opacity:0;transition:opacity .15s;touch-action:none}
.sa:hover>.sb,.sb.is-drag,.sb.is-show,.sb.always{opacity:1}
.sb[data-orientation=vertical]{top:0;bottom:0;right:2px;width:8px}
.sb[data-orientation=horizontal]{left:0;right:0;bottom:2px;height:8px}
.sb-track{position:absolute;inset:0}
.sb-thumb{position:absolute;border-radius:4px;background:var(--stroke-divider);transition:background .12s}
.sb[data-orientation=vertical] .sb-thumb{left:0;width:8px}
.sb[data-orientation=horizontal] .sb-thumb{top:0;height:8px}
.sb:hover .sb-thumb,.sb.is-hover .sb-thumb{background:var(--text-secondary)}
.sb.is-drag .sb-thumb,.sb.is-active .sb-thumb{background:var(--text-primary)}
.sb.static{position:relative;opacity:1}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:24px;padding:0 12px;border-radius:4px;border:1px solid transparent;font:600 12px/1.35 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.btn[data-size=big]{height:32px;padding:0 16px}
.btn[data-variant=primary]{background:var(--bg-secondary);color:var(--fg-invert)}
.btn[data-variant=primary]:is(:hover,.is-hover){background:var(--bg-secondary-light)}
.btn[data-variant=primary][data-tone=destructive]{background:var(--bg-destructive)}
.btn[data-variant=primary][data-tone=destructive]:is(:hover,.is-hover){background:var(--bg-destructive-light)}
.btn[data-variant=secondary]{background:transparent;border-color:var(--stroke-success);color:var(--fg-secondary)}
.btn[data-variant=secondary]:is(:hover,.is-hover){background:color-mix(in srgb,var(--fg-secondary) 22%,transparent)}
.btn[data-variant=secondary][data-tone=destructive]{border-color:var(--fg-destructive);color:var(--fg-destructive)}
.btn[data-variant=secondary][data-tone=destructive]:is(:hover,.is-hover){background:color-mix(in srgb,var(--fg-destructive) 22%,transparent)}
.btn:is(:disabled,.is-disabled)[data-variant]{background:var(--bg-disable);color:var(--text-caption);border-color:transparent;cursor:not-allowed}
.btn:is(:disabled,.is-disabled)[data-variant=secondary]{background:transparent;border-color:var(--bg-disable)}
.btn.icon-only{padding:0;width:24px}
.btn.icon-only[data-size=big]{width:32px}

/* button-icon-sm */
.ibs{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;padding:0;border:0;border-radius:3px;background:none;color:var(--text-secondary);cursor:pointer;flex:none}
.ibs::before{content:"";position:absolute;inset:-4px}
.ibs:is(:hover,.is-hover){color:var(--text-primary)}
.ibs:is([aria-pressed=true],.is-active){color:var(--text-link)}
.ibs:is(:disabled,.is-disabled){color:var(--text-caption);cursor:not-allowed}

/* button-icon-lg */
.ibl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:var(--surface-tertiary);color:var(--text-secondary);font:400 12px/1.35 var(--font-ui);white-space:nowrap;cursor:pointer;flex:none;transition:background .12s,color .12s,border-color .12s}
.ibl:is(:hover,.is-hover){border-color:var(--stroke-primary);color:var(--text-primary)}
.ibl:is([aria-pressed=true],.is-active){background:var(--bg-primary-xdark);color:var(--text-link);border-color:transparent}
.ibl:is(:disabled,.is-disabled){background:var(--bg-disable);color:var(--text-caption);border-color:transparent;cursor:not-allowed}

/* label row / helper (shared) */
.lbl-row{display:flex;align-items:center;gap:8px;min-height:16px;padding:0 4px 0 6px;color:var(--text-secondary);font-weight:600}
.lbl-row .grow{flex:1}
.helper{padding:0 6px;color:var(--text-secondary)}
.helper.err{color:var(--fg-destructive)}
.is-disabled>.lbl-row{color:var(--text-caption)}

/* button-group */
.bgrp{display:flex;flex-direction:column;gap:4px;width:100%}
.bgrp-box{display:flex;gap:4px;padding:4px;background:var(--surface-tertiary);border:1px solid transparent;border-radius:6px}
.bgrp-box:focus-within,.bgrp.is-active .bgrp-box{border-color:var(--stroke-primary)}

/* ---------- Floating layer (portal) ---------- */

          onClick=${() => setOpen(o => o === 'color' ? null : 'color')} />`}

    </div>

    <${Floating} anchor=${anchor} open=${open === 'var'} onClose=${(why) => { setOpen(null); if (why === 'escape') inputRef.current?.focus(); }}>
      <${PopoverPanel} type="var" title=${kind === 'color' ? 'Colour variables' : 'Size variables'} items=${vars} itemKind=${kind === 'color' ? 'color' : 'size'}
        value=${binding} onSelect=${pickVar} onAction=${popAction} />
    <//>
    <${Floating} anchor=${anchor} open=${open === 'options'} onClose=${(why) => { setOpen(null); if (why === 'escape') inputRef.current?.focus(); }}>
      <${PopoverPanel} type="options-list" items=${options} value=${optsVal} listLabel=${label}
        onSelect=${o => { setValue(o.value); setBinding(null); setError(null); setOpen(null); log(`${name}:select`, { value: o.value }); onCommit?.(o.value); inputRef.current?.focus(); }} />

/* ================= form-field-custom (box-model cell) ================= */
function FormFieldCustom({ value = '', placeholder = '0', force, error: errProp, linked, onCommit, onFocusSide, onBlurSide, label = 'Value', allowNegative = true, name = 'side' }) {
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState(errProp ? (value || '123kl') : null);
  const ref = useRef(null);
  const drag = useRef(null);
  const log = useLog();
  const commit = raw => {
    const r = parseSize(raw, { allowNegative });
    if (!r.ok) { setErr(raw); setDraft(null); log(`${name}:invalid`, { input: raw }); return; }
    setErr(null); setDraft(null); if (r.text !== value) onCommit?.(r.text === '0px' ? '' : r.text);
  };
  const onDown = e => {
    if (document.activeElement === ref.current) return;
    e.preventDefault();
    const start = { y: e.clientY, base: parseSize(value || '0'), moved: false };
    drag.current = start;
    const node = ref.current; node.setPointerCapture(e.pointerId);
    const mv = ev => {
      const dy = start.y - ev.clientY;
      if (!start.moved && Math.abs(dy) < 3) return;
      start.moved = true;
      const b = start.base.ok && start.base.num != null ? start.base : { num: 0, unit: 'px' };
      let n = Math.round(b.num + dy / 2); if (!allowNegative) n = Math.max(0, n);
      start.val = `${n}${b.unit}`;
      setErr(null); setDraft(start.val);
    };
    const up = () => {
      node.removeEventListener('pointermove', mv); node.removeEventListener('pointerup', up);
      if (start.moved) { const d = start.val; setDraft(null); if (d != null) { const r = parseSize(d); onCommit?.(r.num === 0 ? '' : r.text); log(`${name}:scrub`, { value: d }); } }
      else { node.focus(); node.select(); }
      drag.current = null;
    };
    node.addEventListener('pointermove', mv); node.addEventListener('pointerup', up);
  };

    if (e.key === 'Enter') { e.preventDefault(); if (draft != null) commit(draft); e.currentTarget.select(); }
    else if (e.key === 'Escape') { setDraft(null); setErr(null); e.currentTarget.blur(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); const base = draft ?? value ?? ''; commit(stepSize(base || '0', (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1))); }

      onFocus=${() => onFocusSide?.()} onBlur=${() => { if (draft != null) commit(draft); onBlurSide?.(); }} />`;

/* ================= padding / margin-padding ================= */
const SIDES = ['top', 'right', 'bottom', 'left'];
const linkedSides = (mode, side) => mode === 'all' ? SIDES : mode === 'x' && (side === 'left' || side === 'right') ? ['left', 'right'] : mode === 'y' && (side === 'top' || side === 'bottom') ? ['top', 'bottom'] : [side];

function usePaddingModel(initial, name, onChange) {
  const [val, setVal] = useState(initial || { top: '', right: '', bottom: '', left: '' });
  const [mode, setMode] = useState('none');
  const [focus, setFocus] = useState(null);
  const log = useLog();
  const commitSide = (side, v) => {
    const sides = linkedSides(mode, side);
    const n = { ...val }; sides.forEach(s => n[s] = v); setVal(n); onChange?.(n);
    log(`${name}:change`, { sides: sides.join('+'), value: v || '0' });
  };
  const cycle = () => { const n = LINK_MODES[(LINK_MODES.indexOf(mode) + 1) % LINK_MODES.length]; setMode(n); log(`${name}:link`, { mode: n }); };
  const active = focus ? linkedSides(mode, focus) : [];
  return { val, mode, focus, setFocus, commitSide, cycle, active };
}

function BoxCells({ m, name, allowNegative, forceSides = {}, prefix, onSelect, placeholders = {} }) {
  return SIDES.map(s => html`<div key=${s} className=${'bx-' + s[0]}>
    <${FormFieldCustom} name=${`${name}-${s}`} label=${`${prefix} ${s}`} value=${m.val[s]} allowNegative=${allowNegative} placeholder=${placeholders[s] || '0'}
      force=${forceSides[s]} linked=${m.focus && m.focus !== s && m.active.includes(s)}
      onFocusSide=${() => { m.setFocus(s); onSelect?.(); }} onBlurSide=${() => m.setFocus(f => f === s ? null : f)} onCommit=${v => m.commitSide(s, v)} /></div>`);
}

/* PaddingBox can own its model (standalone) or receive one from MarginPadding */
function PaddingBox({ initial, force, forceSides, forceMode, large, onChange, name = 'padding', slot, model, onSelect, targeted, placeholders }) {
  const own = usePaddingModel(initial, name, onChange);
  const m = model || own;

  return html`<div className=${cx('pbox', large && 'lg', activeCls, targeted && 'is-target')} role="group" aria-label="Padding">
    <span className="box-lbl">P</span>
    <${BoxCells} m=${mm} name=${name} allowNegative=${false} forceSides=${forceSides} prefix="Padding" onSelect=${onSelect} placeholders=${placeholders} />
    <div className="bx-c">${slot !== undefined ? slot : html`<${ButtonCustom} mode=${mode} onClick=${m.cycle} />`}</div>
  </div>`;
}

/* The single link-sides button in the centre acts on whichever box is selected:
   focusing / clicking a margin side selects margin, a padding side selects padding. */
function MarginPadding({ initialMargin, initialPadding, force, forceSides, forceTarget, forceMode, onChange, placeholders = {} }) {
  const mg = usePaddingModel(initialMargin, 'margin', v => onChange?.({ margin: v }));
  const pd = usePaddingModel(initialPadding, 'padding', v => onChange?.({ padding: v }));
  const [targetState, setTargetState] = useState('padding');
  const target = forceTarget || targetState;
  const log = useLog();
  const select = t => { if (t !== targetState) { setTargetState(t); log('link-target', { box: t }); } };
  const tm = target === 'margin' ? mg : pd;
  const mode = forceMode || tm.mode;
  const mgView = target === 'margin' && forceMode ? { ...mg, mode: forceMode } : mg;
  const onDown = e => {
    if (e.target.closest('.bcu')) return;
    select(e.target.closest('.pbox') ? 'padding' : 'margin');

  const btn = html`<${ButtonCustom} mode=${mode} scope=${target === 'margin' ? 'Margin' : 'Padding'} onClick=${() => { tm.cycle(); }} />`;
  return html`<div className=${cx('mbox', force ? 'is-' + force : mg.focus && 'is-active', target === 'margin' && 'is-target')} role="group" aria-label="Margin" onPointerDown=${onDown}>
    <span className="box-lbl">M</span>
    <${BoxCells} m=${mgView} name="margin" allowNegative=${true} forceSides=${forceSides} prefix="Margin" onSelect=${() => select('margin')} placeholders=${placeholders.margin} />
    <div className="bx-c"><${PaddingBox} model=${pd} slot=${btn} targeted=${target === 'padding'} onSelect=${() => select('padding')} placeholders=${placeholders.padding} /></div>
  </div>`;
}

function highlightCss(src) {
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let out = [], inC = false, depth = 0;
  const val = v => `<span class="tk-v">${esc(v).replace(/-?\d*\.?\d+(px|rem|em|%|vh|vw|ms|s|deg)?/g, m => `<span class="tk-n">${m}</span>`)}</span>`;
  const seg = s => s.split(/([{};])/).map(part => {
    if (part === '{') { depth++; return '<span class="tk-u">{</span>'; }
    if (part === '}') { depth = Math.max(0, depth - 1); return '<span class="tk-u">}</span>'; }
    if (part === ';') return '<span class="tk-u">;</span>';
    if (!part) return '';
    if (depth === 0) return `<span class="tk-s">${esc(part)}</span>`;
    const m = part.match(/^(\s*)([-\w]+)(\s*:)([\s\S]*)$/);
    return m ? `${m[1]}<span class="tk-p">${esc(m[2])}</span><span class="tk-u">${m[3]}</span>${val(m[4])}` : val(part);
  }).join('');
  for (const line of src.split('\n')) {
    let rest = line, h = '';
    while (rest.length) {
      if (inC) { const i = rest.indexOf('*/'); if (i < 0) { h += `<span class="tk-c">${esc(rest)}</span>`; rest = ''; } else { h += `<span class="tk-c">${esc(rest.slice(0, i + 2))}</span>`; rest = rest.slice(i + 2); inC = false; } continue; }
      const ci = rest.indexOf('/*');
      if (ci < 0) { h += seg(rest); rest = ''; } else { h += seg(rest.slice(0, ci)) + '<span class="tk-c">/*</span>'; rest = rest.slice(ci + 2); inC = true; }
    }
    out.push(h);
  }
  return out;
}

  useEffect(() => { onParsed?.(decls, hasRoot); }, [value]);

    ${showScrollbar && html`<div className="sb-h-host"><${Scrollbar} target=${scroller} orientation="horizontal" inset=${10} always=${true} /></div>`}
    ${(showHelper || isErr) && html`<div id=${uid + "-help"} className=${cx('helper', isErr && 'err')}>${isErr ? "Missing :root block. Styles outside of :root won't sync with controls." : helperText}</div>`}

  return html`<div className="panel ds">
    <div className="panel-top"><span>Style</span><span className="el">div.hero-card</span><${IconBtnSm} icon="tune" label="Panel settings" tip="Panel settings" onClick=${() => log('panel:settings', {})} /></div>

    <//>
    <${Accordion} title="Size" hasChanges=${has('size')} showInfo=${false}>
      <div className="two">
        <${FormField} name="width" label="Width" placeholder="auto" allowVariables=${true} allowNegative=${false} onStateChange=${mark('size', 'w')} />

      <${FormField} name="font" label="Font" mode="dropdown" placeholder="Roboto" options=${FONT_OPTS} onStateChange=${mark('type', 'font')} />

      <${ButtonGroup} label="Align" items=${ALIGN_ITEMS.slice(0, 4)} showText=${false} onChange=${v => setCh(c => ({ ...c, 'type:align': v !== 'left' }))} />
    <//>
    <${Accordion} title="Fill" hasChanges=${has('fill')} showInfo=${false}>
      <${FormField} name="background" label="Background" kind="color" allowVariables=${true} connected="color" placeholder="none" onStateChange=${mark('fill', 'bg')} />
    <//>
    <${Accordion} title="Custom CSS" showInfo=${false}>
      <${CodeArea} showLabel=${false} showScrollbar=${true} />
    <//>
  </div>`;
}

function TokensPage() {
  const colors = [['surface/primary', '#0F172A'], ['surface/secondary', '#192133'], ['surface/tertiary', '#1E293B'], ['bg/disable', '#334155'], ['bg/primary-extra-dark', '#0C2B4F'], ['bg/secondary', '#1AE07C'], ['bg/secondary-light', '#B7FBD8'], ['bg/destructive', '#FF6D69'], ['bg/destructive-light', '#FFC8C7'],
    ['text/primary', '#F8FAFC'], ['text/secondary', '#94A3B8'], ['text/caption', '#64748B'], ['text/link', '#56A3F5'], ['fg/secondary', '#1AE07C'], ['fg/destructive', '#FF6D69'], ['fg/White-invert', '#0F172A'],
    ['stroke/primary', '#94A3B8'], ['stroke/accent', '#56A3F5'], ['stroke/destructive', '#FF6D69'], ['stroke/attention', '#F2D23C'], ['stroke/success', '#1AE07C'], ['stroke/divider', '#475569'], ['stroke/disabled ⚠', '#334155 / #475569']];
  const scale = (title, arr) => html`<div className="card"><div className="bar">${title}</div><div className="scale">${arr.map(([n, v]) => html`<div className="scale-row" key=${n}><span>${n}</span><span>${v}px</span><i style=${{ width: v * 4 }}></i></div>`)}</div></div>`;
  return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 24 }}>
    <div className="card"><div className="bar">Colour</div><div className="tok-grid">${colors.map(([n, v]) => html`<div className="tok" key=${n}>
      <span className="tok-sw" style=${{ background: v.includes('/') ? `linear-gradient(90deg,#334155 50%,#475569 50%)` : v }}></span><div><b>${n}</b><span>${v}</span></div></div>`)}</div></div>
    <div className="grid2">
      ${scale('Gap / padding', [['1x', 4], ['1,5x', 6], ['2x', 8], ['3x', 12], ['4x', 16], ['6x', 24]])}
      ${scale('Radius', [['radius/1x', 4], ['radius/1,5x', 6], ['radius/2x', 8], ['radius/3x', 12]])}
    </div>
    <div className="card"><div className="bar">Type · Roboto</div><div className="note ds" style=${{ gap: 12 }}>
      <div><span style=${{ font: '400 12px/1.35 var(--font-ui)', color: 'var(--text-primary)' }}>Body — Roboto 12 / 400 / 1.35 — The quick brown fox sets padding to 16px</span></div>
      <div><span style=${{ font: '600 12px/1.35 var(--font-ui)', color: 'var(--text-primary)' }}>Body strong — Roboto 12 / 600 / 1.35 — Section header</span></div>
      <div><span style=${{ font: '400 12px/18px var(--font-code)', color: 'var(--text-link)' }}>Code — Roboto Mono 12 / 18 — margin: 10px;</span></div>
    </div></div>
    <div className="card"><div className="bar">Elevation</div><div className="note"><div style=${{ display: 'flex', gap: 24, alignItems: 'center', padding: 16, background: 'var(--surface-primary)', borderRadius: 8 }}>
      <div style=${{ width: 120, height: 64, borderRadius: 6, background: 'var(--surface-tertiary)', boxShadow: 'var(--shadow1)' }}></div><span className="tag">Shadow1 · 0 0 10px 4px #000316</span></div></div></div>
  </div>`;
}

/* ================= Workbench shell ================= */
const QA_OPTS = [['untested', 'Untested'], ['wip', 'In review'], ['ok', 'Works'], ['fix', 'Needs fix']];
const defaultsOf = s => Object.fromEntries((s.knobs || []).map(k => [k.key, k.def]));

function Knob({ k, value, onChange }) {
  const id = 'k-' + k.key;
  let ctl;
  if (k.type === 'bool') ctl = html`<button type="button" id=${id} className="switch" role="switch" aria-checked=${!!value} onClick=${() => onChange(!value)}><span className="sr-only">${k.label}</span></button>`;
  else if (k.type === 'select' && k.opts.length <= 4 && k.opts.join('').length <= 36) ctl = html`<div className="ctl-seg" role="group" aria-labelledby=${id + '-l'}>${k.opts.map(o => html`<button type="button" key=${o} aria-pressed=${value === o} onClick=${() => onChange(o)}>${o}</button>`)}</div>`;
  else if (k.type === 'select') ctl = html`<select id=${id} value=${value} onChange=${e => onChange(e.target.value)}>${k.opts.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
  else ctl = html`<input type="text" id=${id} value=${value} onChange=${e => onChange(e.target.value)} spellCheck=${false} />`;
  return html`<div className="ctl">${k.type === 'select' && k.opts.length <= 4 && k.opts.join('').length <= 36 ? html`<span className="cl" id=${id + '-l'}>${k.label}</span>` : html`<label htmlFor=${id}>${k.label}</label>`}${ctl}</div>`;
}

function App() {
  const ids = STORIES.map(s => s.id);
  const fromHash = () => { const h = (location.hash || '').slice(1); return ids.includes(h) ? h : null; };
  const [cur, setCur] = useState(() => fromHash() || store.get('cur', 'form-field'));
  const [q, setQ] = useState('');
  const [argsMap, setArgsMap] = useState({});
  const [qa, setQa] = useState(() => store.get('qa', {}));
  const [checks, setChecks] = useState(() => store.get('checks', {}));
  const [logs, setLogs] = useState([]);
  const [stamp, setStamp] = useState(0);
  const story = STORIES.find(s => s.id === cur) || STORIES[0];
  const args = argsMap[story.id] || defaultsOf(story);
  useEffect(() => { store.set('cur', cur); setLogs([]); try { history.replaceState(null, '', '#' + cur); } catch (e) { } document.querySelector('.main')?.scrollTo(0, 0); }, [cur]);
  useEffect(() => { const f = () => { const h = fromHash(); if (h) setCur(h); }; window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const log = useCallback((ev, payload) => {
    const t = new Date(); const time = t.toTimeString().slice(0, 8);
    setLogs(l => [{ id: t.getTime() + Math.random(), time, ev, pl: payload && Object.keys(payload).length ? JSON.stringify(payload) : '' }, ...l].slice(0, 60));
  }, []);
  const setArg = (k, v) => setArgsMap(m => ({ ...m, [story.id]: { ...args, [k]: v } }));
  const setQA = v => { const n = { ...qa, [story.id]: v }; setQa(n); store.set('qa', n); };
  const toggleCheck = i => { const cur = new Set(checks[story.id] || []); cur.has(i) ? cur.delete(i) : cur.add(i); const n = { ...checks, [story.id]: [...cur] }; setChecks(n); store.set('checks', n); };
  const counts = STORIES.reduce((a, s) => { const v = qa[s.id] || 'untested'; a[v] = (a[v] || 0) + 1; return a; }, {});
  const total = STORIES.length;
  const groups = [...new Set(STORIES.map(s => s.group))];
  const match = s => !q || (s.name + ' ' + s.group + ' ' + (s.desc || '')).toLowerCase().includes(q.toLowerCase());
  const done = new Set(checks[story.id] || []);

  let canvas;
  if (story.special === 'tokens') canvas = null;
  else if (story.special === 'panel') canvas = html`<${PanelSandbox} key=${stamp} />`;
  else canvas = html`<div className="frame ds" data-w=${story.frame ? story.frame + ' px' : undefined} style=${{ width: story.frame || undefined }} key=${stamp + JSON.stringify(args)}>${story.render(args, log)}</div>`;

  return html`<${LogCtx.Provider} value=${log}>
  <div className="wb">
    <aside className="side" aria-label="Components">
      <div className="brand">
        <h1>Style Bar Workbench</h1>
        <p>Style panel components · every state</p>
        <div className="progress" aria-label="Review progress">
          <div className="progress-bar">
            <span style=${{ width: `${(counts.ok || 0) / total * 100}%`, background: 'var(--wb-ok)' }}></span>
            <span style=${{ width: `${(counts.wip || 0) / total * 100}%`, background: 'var(--wb-warn)' }}></span>
            <span style=${{ width: `${(counts.fix || 0) / total * 100}%`, background: 'var(--wb-bad)' }}></span>
          </div>
          <div className="progress-meta"><span>${counts.ok || 0}/${total} work</span><span>${counts.fix || 0} need fix</span></div>
        </div>
      </div>
      <div className="search"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d=${ICONS.search} fill="currentColor"/></svg>
        <input type="text" id="nav-search" placeholder="Filter components" value=${q} onChange=${e => setQ(e.target.value)} aria-label="Filter components" /></div>
      <nav className="nav">
        ${groups.map(g => { const items = STORIES.filter(s => s.group === g && match(s)); if (!items.length) return null;
          return html`<div className="nav-group" key=${g}><h2>${g}</h2>${items.map(s => html`<button type="button" key=${s.id} className="nav-item" aria-current=${s.id === cur ? 'page' : undefined} onClick=${() => setCur(s.id)}>
            <span className="qdot" data-q=${qa[s.id] || 'untested'} title=${(QA_OPTS.find(o => o[0] === (qa[s.id] || 'untested')) || [])[1]}></span><span className="nm">${s.name}</span></button>`)}</div>`; })}
      </nav>
    </aside>
    <main className="main">
      <div className="mobile-nav">
        <strong style=${{ fontSize: 16 }}>Style Bar Workbench</strong>
        <select aria-label="Component" value=${cur} onChange=${e => setCur(e.target.value)}>${groups.map(g => html`<optgroup key=${g} label=${g}>${STORIES.filter(s => s.group === g).map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</optgroup>`)}</select>
      </div>
      <div className="page">
        <header className="phead">
          <div className="phead-l">
            <div className="eyebrow"><span>${story.group}</span></div>
            <h2>${story.name}</h2>
            <p>${story.desc}</p>
          </div>
          ${story.special !== 'tokens' && html`<div className="qa"><span className="qa-label">Review status</span>
            <div className="qa-seg" role="group" aria-label="Review status">${QA_OPTS.map(([v, l]) => html`<button type="button" key=${v} aria-pressed=${(qa[story.id] || 'untested') === v} onClick=${() => setQA(v)}><span className="qdot" data-q=${v}></span>${l}</button>`)}</div></div>`}
        </header>

        ${story.special === 'tokens' ? html`<${TokensPage} />` : html`
        <section className="stage" aria-label="Playground">
          <div className="canvas-wrap">
            <div className="bar"><span>Playground</span><span className="sp"></span>
              <button type="button" onClick=${() => { setStamp(s => s + 1); log('workbench:remount', {}); }}>Remount</button></div>
            <div className=${cx('canvas', story.special === 'panel' && 'top')}>${canvas}</div>
          </div>
          <div className="controls">
            <div className="bar"><span>Controls</span><span className="sp"></span>${story.knobs?.length ? html`<button type="button" onClick=${() => setArgsMap(m => ({ ...m, [story.id]: defaultsOf(story) }))}>Reset</button>` : null}</div>
            ${story.knobs?.length ? html`<div className="ctl-list">${story.knobs.map(k => html`<${Knob} key=${k.key} k=${k} value=${args[k.key]} onChange=${v => setArg(k.key, v)} />`)}</div>`
              : html`<div className="ctl-empty">${story.special === 'panel' ? 'No controls. Interact with the panel directly; every event is logged below.' : 'No properties. Click the component to cycle its states.'}</div>`}
          </div>
        </section>

        <div className="grid2">
          <section className="card" aria-label="Checks">
            <div className="bar"><span>What to check</span><span className="sp"></span><span style=${{ textTransform: 'none', letterSpacing: 0 }}>${done.size}/${(story.checks || []).length}</span></div>
            <ul className="checks">${(story.checks || []).map((c, i) => html`<li key=${i} className=${done.has(i) ? 'done' : ''}><label><input type="checkbox" checked=${done.has(i)} onChange=${() => toggleCheck(i)} /><span>${c}</span></label></li>`)}</ul>
          </section>
          <section className="card" aria-label="Actions">
            <div className="bar"><span>Actions</span><span className="sp"></span><button type="button" onClick=${() => setLogs([])}>Clear</button></div>
            ${logs.length ? html`<ol className="log" aria-live="polite">${logs.map(l => html`<li key=${l.id}><time>${l.time}</time><span><span className="ev">${l.ev}</span> <span className="pl">${l.pl}</span></span></li>`)}</ol>`
              : html`<div className="log-empty">Interact with the component. Commits, selections and state changes appear here.</div>`}
          </section>
        </div>

        ${story.matrix && html`<section className="card" aria-label="All states">
          <div className="bar"><span>All Figma variants</span><span className="sp"></span><span style=${{ textTransform: 'none', letterSpacing: 0 }}>static · forced states</span></div>
          <div className="matrix-scroll ds">${story.matrix()}</div>
        </section>`}

        ${(story.issues || story.inferred) && html`<div className="grid2">
          ${story.issues && html`<section className="card"><div className="bar">Figma issues</div><ul className="issues">${story.issues.map((t, i) => html`<li key=${i}>${t}</li>`)}</ul></section>`}
          ${story.inferred && html`<section className="card"><div className="bar">Inferred behaviour <span className="tag inf" style=${{ marginLeft: 6 }}>confirm with design</span></div><ul className="issues" style=${{ '--x': 1 }}>${story.inferred.map((t, i) => html`<li key=${i}>${t}</li>`)}</ul></section>`}
        </div>`}
        `}
      </div>
    </main>
  </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>

</body>
</html>
